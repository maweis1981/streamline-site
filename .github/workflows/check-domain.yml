name: Check custom domain

# Diagnostic: DNS records, HTTP(S) responses, and GitHub Pages domain/HTTPS status.
# Runs on demand from the Actions tab, or when this file changes.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/check-domain.yml"]

permissions:
  pages: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: DNS
        run: |
          echo "doubo.tv CAA: $(dig +short doubo.tv CAA @1.1.1.1 | tr '\n' ' ')"
          echo "doubo.tv NS: $(dig +short doubo.tv NS @1.1.1.1 | tr '\n' ' ')"
          for name in doubo.tv www.doubo.tv; do
            for type in A AAAA CNAME; do
              echo "$name $type: $(dig +short "$name" "$type" @1.1.1.1 | tr '\n' ' ')"
            done
          done

      - name: HTTP and HTTPS
        run: |
          for url in http://doubo.tv/ https://doubo.tv/ https://www.doubo.tv/ https://doubo.tv/en/; do
            echo "$url -> $(curl -s -o /dev/null -m 15 -w '%{http_code} %{redirect_url}' "$url" || echo unreachable)"
          done
          echo "GTM on homepage: $(curl -s -m 15 https://doubo.tv/ | grep -c GTM-MJDCLXML || true)"
          echo "--- head of https://doubo.tv/ ---"
          curl -s -m 15 https://doubo.tv/ | head -40
          echo "--- served headers ---"
          curl -sI -m 15 https://doubo.tv/ | grep -iE 'last-modified|age|cache|etag|x-cache' || true
          echo "--- container script (404 = container not published yet) ---"
          echo "gtm.js -> $(curl -s -o /dev/null -w '%{http_code} %{size_download}B' -m 15 'https://www.googletagmanager.com/gtm.js?id=GTM-MJDCLXML')"

      - name: Analytics (GTM container contents)
        run: |
          curl -s -m 20 -o gtm.js 'https://www.googletagmanager.com/gtm.js?id=GTM-MJDCLXML'
          echo "gtm.js size: $(wc -c < gtm.js) bytes"
          echo "GA4 measurement IDs in container: $(grep -o 'G-[A-Z0-9]\{6,12\}' gtm.js | sort -u | tr '\n' ' ')"
          for event in cta_click language_switch faq_open consent_update web_play web_playlist_add tool_m3u_analyze tool_m3u_download playlist_copy; do
            echo "trigger for $event: $(grep -c "\"$event\"" gtm.js)"
          done
          echo "consent mode references: $(grep -o 'ad_storage\|analytics_storage' gtm.js | sort | uniq -c | tr '\n' ' ')"

      - name: TLS certificate served
        run: |
          echo | openssl s_client -connect doubo.tv:443 -servername doubo.tv 2>/dev/null | openssl x509 -noout -subject -issuer -dates -ext subjectAltName || echo "no certificate"

      - name: GitHub Pages status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/pages" \
            --jq '{cname, status, https_enforced, html_url, protected_domain_state, https_certificate}' || true
          gh api "repos/${GITHUB_REPOSITORY}/pages/health" || true
