name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "7 3 * * *"   # daily, after streamline-iptv/iptv-playlists rebuilds the channel directory

permissions:
  contents: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # Values come from repository variables (Settings → Secrets and variables → Actions → Variables).
      - name: Write deploy config
        env:
          GTM_ID: ${{ vars.GTM_ID }}
          GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
          APP_STORE_URL: ${{ vars.APP_STORE_URL }}
          TESTFLIGHT_URL: ${{ vars.TESTFLIGHT_URL }}
          GOOGLE_PLAY_URL: ${{ vars.GOOGLE_PLAY_URL }}
          SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
        run: |
          ruby -ryaml -e '
            base = YAML.load_file("_config.yml")
            links = base["links"].merge({
              "app_store" => ENV["APP_STORE_URL"], "testflight" => ENV["TESTFLIGHT_URL"], "google_play" => ENV["GOOGLE_PLAY_URL"], "support_email" => ENV["SUPPORT_EMAIL"]
            }.reject { |_, v| v.to_s.strip.empty? })
            analytics = base["analytics"].merge({
              "gtm_id" => ENV["GTM_ID"], "ga_measurement_id" => ENV["GA_MEASUREMENT_ID"]
            }.reject { |_, v| v.to_s.strip.empty? })
            File.write("_config.deploy.yml", { "links" => links, "analytics" => analytics }.to_yaml)
          '
          cat _config.deploy.yml

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The channel directory pages are generated from the index published by streamline-iptv/iptv-playlists.
      # If the index cannot be fetched, the site still builds, just without the directory.
      - name: Generate channel directory pages
        run: |
          if curl -fsSL --retry 3 -o "$RUNNER_TEMP/index.json" https://raw.githubusercontent.com/streamline-iptv/iptv-playlists/dist/index.json; then
            pip install -q babel==2.17.0 pyyaml==6.0.2
            python scripts/directory.py "$RUNNER_TEMP/index.json"
          else
            echo "::warning::Channel directory index not available; building without it"
          fi

      # The web player (web-app/) is built into assets/web/ before Jekyll copies it into the site.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-app/package-lock.json

      - name: Build web player
        working-directory: web-app
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build

      - name: Build
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --config _config.yml,_config.deploy.yml

      # Publishes the built site to the gh-pages branch, which GitHub Pages serves.
      - name: Deploy to gh-pages
        if: github.event_name != 'pull_request'
        working-directory: _site
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
