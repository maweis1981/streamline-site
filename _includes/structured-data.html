{%- comment -%} JSON-LD for search engines. Values come from the current locale. {%- endcomment -%}
{%- assign home_abs = home_url | absolute_url -%}
{%- if page.ref == "home" %}
<script type="application/ld+json">
{"@context":"https://schema.org","@graph":[
 {"@type":"WebSite","@id":{{ '/#website' | absolute_url | jsonify }},"url":{{ home_abs | jsonify }},"name":"Doubo","alternateName":["都播","Doubo IPTV Player"],"inLanguage":{{ t.html_lang | jsonify }}},
 {"@type":"SoftwareApplication","name":"Doubo","alternateName":"都播","applicationCategory":"MultimediaApplication","applicationSubCategory":"IPTV / M3U player","operatingSystem":"iOS 17, iPadOS 17, macOS 14","description":{{ t.meta.description | jsonify }},{% if t.meta.keywords %}"keywords":{{ t.meta.keywords | jsonify }},{% endif %}"url":{{ home_abs | jsonify }},"image":{{ '/assets/img/icon-256.png' | absolute_url | jsonify }},"inLanguage":{{ t.html_lang | jsonify }}},
 {"@type":"FAQPage","mainEntity":[{%- for item in t.faq.items -%}{"@type":"Question","name":{{ item.q | jsonify }},"acceptedAnswer":{"@type":"Answer","text":{{ item.a | jsonify }}}}{% unless forloop.last %},{% endunless %}{%- endfor -%}]}
]}
</script>
{%- elsif page.ref == "404" %}
{%- else %}
{%- assign crumb_name = page.title | default: t.brand -%}
<script type="application/ld+json">
{"@context":"https://schema.org","@graph":[
 {"@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":{{ t.brand | jsonify }},"item":{{ home_abs | jsonify }}},{"@type":"ListItem","position":2,"name":{{ crumb_name | jsonify }},"item":{{ page.url | absolute_url | jsonify }}}]}
 {%- if page.ref == "support" -%}
 ,{"@type":"FAQPage","mainEntity":[{%- for item in t.faq.items -%}{"@type":"Question","name":{{ item.q | jsonify }},"acceptedAnswer":{"@type":"Answer","text":{{ item.a | jsonify }}}}{% unless forloop.last %},{% endunless %}{%- endfor -%}]}
 {%- elsif page.layout == "article" -%}
 {%- assign ar = site.data.articles[page.article][page.lang] -%}
 ,{"@type":"Article","headline":{{ page.title | jsonify }},"description":{{ page.description | jsonify }},"inLanguage":{{ t.html_lang | jsonify }},"datePublished":{{ page.updated | jsonify }},"dateModified":{{ page.updated | jsonify }},"author":{"@type":"Organization","name":"Doubo","url":{{ '/' | absolute_url | jsonify }}},"publisher":{"@type":"Organization","name":"Doubo","logo":{"@type":"ImageObject","url":{{ '/assets/img/icon-256.png' | absolute_url | jsonify }}}},"mainEntityOfPage":{{ page.url | absolute_url | jsonify }}}
 ,{"@type":"FAQPage","mainEntity":[{%- for item in ar.faq -%}{"@type":"Question","name":{{ item.q | jsonify }},"acceptedAnswer":{"@type":"Answer","text":{{ item.a | jsonify }}}}{% unless forloop.last %},{% endunless %}{%- endfor -%}]}
 {%- elsif page.layout == "dataset" -%}
 {%- assign dsx = site.data.dataset -%}
 {%- assign dtop = dsx.country_rows | first -%}
 {%- assign dtc = site.data.directory.countries | where: "code", dtop.code | first -%}
 ,{"@type":"Dataset","name":{{ page.title | jsonify }},"description":{{ page.description | jsonify }},"url":{{ page.url | absolute_url | jsonify }},"inLanguage":{{ t.html_lang | jsonify }},"license":"https://creativecommons.org/licenses/by/4.0/","isAccessibleForFree":true,"creator":{"@type":"Organization","name":"Doubo","url":{{ '/' | absolute_url | jsonify }}},"dateModified":{{ dsx.generated_at | jsonify }},"temporalCoverage":{{ dsx.generated_at | jsonify }},"keywords":["IPTV","free TV channels","live TV","M3U","television by country"],"measurementTechnique":"Daily automated check of public broadcaster streams","variableMeasured":["channels listed","channels playable in a web browser"],"distribution":[{"@type":"DataDownload","encodingFormat":"text/csv","contentUrl":{{ '/data/free-tv-channels-by-country.csv' | absolute_url | jsonify }}},{"@type":"DataDownload","encodingFormat":"text/csv","contentUrl":{{ '/data/free-tv-channels.csv' | absolute_url | jsonify }}},{"@type":"DataDownload","encodingFormat":"application/json","contentUrl":{{ '/data/free-tv-channels-by-country.json' | absolute_url | jsonify }}}]}
 ,{"@type":"FAQPage","mainEntity":[{%- for item in t.dataset.faq -%}{"@type":"Question","name":{{ item.q | jsonify }},"acceptedAnswer":{"@type":"Answer","text":{{ item.a | replace: "%country%", dtc.names[page.lang] | replace: "%n%", dtop.listed | jsonify }}}}{% unless forloop.last %},{% endunless %}{%- endfor -%}]}
 {%- elsif page.layout == "watch" -%}
 {%- assign ws = t.watch -%}
 ,{"@type":"Article","headline":{{ page.title | jsonify }},"description":{{ page.description | jsonify }},"inLanguage":{{ t.html_lang | jsonify }},"datePublished":{{ page.updated | jsonify }},"dateModified":{{ page.updated | jsonify }},"author":{"@type":"Organization","name":"Doubo","url":{{ '/' | absolute_url | jsonify }}},"publisher":{"@type":"Organization","name":"Doubo","logo":{"@type":"ImageObject","url":{{ '/assets/img/icon-256.png' | absolute_url | jsonify }}}},"mainEntityOfPage":{{ page.url | absolute_url | jsonify }},"about":{"@type":"Country","name":{{ page.country_name | jsonify }}}}
 ,{"@type":"FAQPage","mainEntity":[{"@type":"Question","name":{{ ws.fq_free | replace: "%country%", page.country_name | jsonify }},"acceptedAnswer":{"@type":"Answer","text":{{ ws.fa_free | replace: "%country%", page.country_name | jsonify }}}},{"@type":"Question","name":{{ ws.fq_app | replace: "%country%", page.country_name | jsonify }},"acceptedAnswer":{"@type":"Answer","text":{{ ws.fa_app | replace: "%country%", page.country_name | replace: "%apps%", page.apps | jsonify }}}},{"@type":"Question","name":{{ ws.fq_abroad | replace: "%country%", page.country_name | jsonify }},"acceptedAnswer":{"@type":"Answer","text":{{ ws.fa_abroad | replace: "%country%", page.country_name | jsonify }}}}]}
 {%- elsif page.layout == "channel" -%}
 {%- assign c = page.channel -%}
 ,{"@type":"TelevisionChannel","name":{{ c.name | jsonify }},"url":{{ page.url | absolute_url | jsonify }},"broadcastChannelId":{{ c.id | jsonify }},"genre":{{ c.category | jsonify }}{% if c.website %},"sameAs":{{ c.website | jsonify }}{% endif %},"providesBroadcastService":{"@type":"BroadcastService","name":{{ c.name | jsonify }},"areaServed":{"@type":"Country","name":{{ c.country_name | jsonify }}}{% if c.languages.size > 0 %},"inLanguage":{{ c.languages | jsonify }}{% endif %}{% if c.owners.size > 0 %},"broadcaster":{"@type":"Organization","name":{{ c.owners | join: ", " | jsonify }}}{% endif %}{% if c.logo %},"logo":{{ c.logo | jsonify }}{% endif %}}}
 ,{"@type":"FAQPage","mainEntity":[{%- for item in c.faq -%}{"@type":"Question","name":{{ item.q | jsonify }},"acceptedAnswer":{"@type":"Answer","text":{{ item.a | jsonify }}}}{% unless forloop.last %},{% endunless %}{%- endfor -%}]}
 {%- elsif page.layout == "device-guide" -%}
 {%- assign g = site.data.guides[page.lang].devices[page.device] -%}
 ,{"@type":"HowTo","name":{{ g.title | jsonify }},"description":{{ g.description | jsonify }},"inLanguage":{{ t.html_lang | jsonify }},"supply":[{%- for n in g.need -%}{"@type":"HowToSupply","name":{{ n | jsonify }}}{% unless forloop.last %},{% endunless %}{%- endfor -%}],"step":[{%- for s in g.steps -%}{"@type":"HowToStep","position":{{ forloop.index }},"name":{{ s.title | jsonify }},"text":{{ s.desc | jsonify }},"url":{{ page.url | append: '#step-' | append: forloop.index | absolute_url | jsonify }}}{% unless forloop.last %},{% endunless %}{%- endfor -%}]}
 ,{"@type":"FAQPage","mainEntity":[{%- for item in g.faq -%}{"@type":"Question","name":{{ item.q | jsonify }},"acceptedAnswer":{"@type":"Answer","text":{{ item.a | jsonify }}}}{% unless forloop.last %},{% endunless %}{%- endfor -%}]}
 {%- elsif page.ref == "web" -%}
 ,{"@type":"WebApplication","name":{{ t.web.page_title | jsonify }},"url":{{ page.url | absolute_url | jsonify }},"applicationCategory":"MultimediaApplication","operatingSystem":"Any (web browser)","browserRequirements":"Requires JavaScript and HTML5 video","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"},"description":{{ t.web.seo_intro | jsonify }},"inLanguage":{{ t.html_lang | jsonify }}}
 ,{"@type":"FAQPage","mainEntity":[{%- for item in t.web.faq -%}{"@type":"Question","name":{{ item.q | jsonify }},"acceptedAnswer":{"@type":"Answer","text":{{ item.a | jsonify }}}}{% unless forloop.last %},{% endunless %}{%- endfor -%}]}
 {%- elsif page.ref == "tools-m3u" -%}
 ,{"@type":"WebApplication","name":{{ t.tools.title | jsonify }},"url":{{ page.url | absolute_url | jsonify }},"applicationCategory":"UtilitiesApplication","operatingSystem":"Any (web browser)","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"},"description":{{ t.tools.page_desc | jsonify }},"inLanguage":{{ t.html_lang | jsonify }}}
 ,{"@type":"FAQPage","mainEntity":[{%- for item in t.tools.faq -%}{"@type":"Question","name":{{ item.q | jsonify }},"acceptedAnswer":{"@type":"Answer","text":{{ item.a | jsonify }}}}{% unless forloop.last %},{% endunless %}{%- endfor -%}]}
 {%- elsif page.ref == "guide" -%}
 ,{"@type":"HowTo","name":{{ t.guide.subtitle | jsonify }},"description":{{ t.guide.description | jsonify }},"inLanguage":{{ t.html_lang | jsonify }},"supply":[{"@type":"HowToSupply","name":"M3U / M3U8 playlist"}],"tool":[{"@type":"HowToTool","name":"Doubo (iPhone, iPad, Mac)"}],"step":[{%- for s in t.guide.steps -%}{"@type":"HowToStep","position":{{ forloop.index }},"name":{{ s.title | jsonify }},"text":{{ s.desc | jsonify }},"url":{{ page.url | append: '#step-' | append: forloop.index | absolute_url | jsonify }}}{% unless forloop.last %},{% endunless %}{%- endfor -%}]}
 {%- endif %}
]}
</script>
{%- endif %}
