{%- comment -%} JSON-LD for search engines. Values come from the current locale. {%- endcomment -%}
{%- assign home_abs = home_url | absolute_url -%}
{%- if page.ref == "home" %}
<script type="application/ld+json">
{"@context":"https://schema.org","@graph":[
 {"@type":"WebSite","@id":{{ '/#website' | absolute_url | jsonify }},"url":{{ home_abs | jsonify }},"name":"Doubo","alternateName":["都播","Doubo IPTV Player"],"inLanguage":{{ t.html_lang | jsonify }}},
 {"@type":"SoftwareApplication","name":"Doubo","alternateName":"都播","applicationCategory":"MultimediaApplication","applicationSubCategory":"IPTV / M3U player","operatingSystem":"iOS 17, iPadOS 17, macOS 14","description":{{ t.meta.description | jsonify }},"url":{{ home_abs | jsonify }},"image":{{ '/assets/img/icon-256.png' | absolute_url | jsonify }},"inLanguage":{{ t.html_lang | jsonify }}},
 {"@type":"FAQPage","mainEntity":[{%- for item in t.faq.items -%}{"@type":"Question","name":{{ item.q | jsonify }},"acceptedAnswer":{"@type":"Answer","text":{{ item.a | jsonify }}}}{% unless forloop.last %},{% endunless %}{%- endfor -%}]}
]}
</script>
{%- elsif page.ref == "404" %}
{%- else %}
{%- assign crumb_name = page.title | default: t.brand -%}
<script type="application/ld+json">
{"@context":"https://schema.org","@graph":[
 {"@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":{{ t.brand | jsonify }},"item":{{ home_abs | jsonify }}},{"@type":"ListItem","position":2,"name":{{ crumb_name | jsonify }},"item":{{ page.url | absolute_url | jsonify }}}]}
 {%- if page.ref == "support" -%}
 ,{"@type":"FAQPage","mainEntity":[{%- for item in t.faq.items -%}{"@type":"Question","name":{{ item.q | jsonify }},"acceptedAnswer":{"@type":"Answer","text":{{ item.a | jsonify }}}}{% unless forloop.last %},{% endunless %}{%- endfor -%}]}
 {%- elsif page.layout == "channel" -%}
 {%- assign c = page.channel -%}
 ,{"@type":"TelevisionChannel","name":{{ c.name | jsonify }},"url":{{ page.url | absolute_url | jsonify }},"broadcastChannelId":{{ c.id | jsonify }},"genre":{{ c.category | jsonify }}{% if c.website %},"sameAs":{{ c.website | jsonify }}{% endif %},"providesBroadcastService":{"@type":"BroadcastService","name":{{ c.name | jsonify }},"areaServed":{"@type":"Country","name":{{ c.country_name | jsonify }}}{% if c.languages.size > 0 %},"inLanguage":{{ c.languages | jsonify }}{% endif %}{% if c.owners.size > 0 %},"broadcaster":{"@type":"Organization","name":{{ c.owners | join: ", " | jsonify }}}{% endif %}{% if c.logo %},"logo":{{ c.logo | jsonify }}{% endif %}}}
 ,{"@type":"FAQPage","mainEntity":[{%- for item in c.faq -%}{"@type":"Question","name":{{ item.q | jsonify }},"acceptedAnswer":{"@type":"Answer","text":{{ item.a | jsonify }}}}{% unless forloop.last %},{% endunless %}{%- endfor -%}]}
 {%- elsif page.layout == "device-guide" -%}
 {%- assign g = site.data.guides[page.lang].devices[page.device] -%}
 ,{"@type":"HowTo","name":{{ g.title | jsonify }},"description":{{ g.description | jsonify }},"inLanguage":{{ t.html_lang | jsonify }},"supply":[{%- for n in g.need -%}{"@type":"HowToSupply","name":{{ n | jsonify }}}{% unless forloop.last %},{% endunless %}{%- endfor -%}],"step":[{%- for s in g.steps -%}{"@type":"HowToStep","position":{{ forloop.index }},"name":{{ s.title | jsonify }},"text":{{ s.desc | jsonify }},"url":{{ page.url | append: '#step-' | append: forloop.index | absolute_url | jsonify }}}{% unless forloop.last %},{% endunless %}{%- endfor -%}]}
 ,{"@type":"FAQPage","mainEntity":[{%- for item in g.faq -%}{"@type":"Question","name":{{ item.q | jsonify }},"acceptedAnswer":{"@type":"Answer","text":{{ item.a | jsonify }}}}{% unless forloop.last %},{% endunless %}{%- endfor -%}]}
 {%- elsif page.ref == "web" -%}
 ,{"@type":"WebApplication","name":{{ t.web.page_title | jsonify }},"url":{{ page.url | absolute_url | jsonify }},"applicationCategory":"MultimediaApplication","operatingSystem":"Any (web browser)","browserRequirements":"Requires JavaScript and HTML5 video","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"},"description":{{ t.web.seo_intro | jsonify }},"inLanguage":{{ t.html_lang | jsonify }}}
 ,{"@type":"FAQPage","mainEntity":[{%- for item in t.web.faq -%}{"@type":"Question","name":{{ item.q | jsonify }},"acceptedAnswer":{"@type":"Answer","text":{{ item.a | jsonify }}}}{% unless forloop.last %},{% endunless %}{%- endfor -%}]}
 {%- elsif page.ref == "tools-m3u" -%}
 ,{"@type":"WebApplication","name":{{ t.tools.title | jsonify }},"url":{{ page.url | absolute_url | jsonify }},"applicationCategory":"UtilitiesApplication","operatingSystem":"Any (web browser)","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"},"description":{{ t.tools.page_desc | jsonify }},"inLanguage":{{ t.html_lang | jsonify }}}
 ,{"@type":"FAQPage","mainEntity":[{%- for item in t.tools.faq -%}{"@type":"Question","name":{{ item.q | jsonify }},"acceptedAnswer":{"@type":"Answer","text":{{ item.a | jsonify }}}}{% unless forloop.last %},{% endunless %}{%- endfor -%}]}
 {%- elsif page.ref == "guide" -%}
 ,{"@type":"HowTo","name":{{ t.guide.subtitle | jsonify }},"description":{{ t.guide.description | jsonify }},"inLanguage":{{ t.html_lang | jsonify }},"supply":[{"@type":"HowToSupply","name":"M3U / M3U8 playlist"}],"tool":[{"@type":"HowToTool","name":"Doubo (iPhone, iPad, Mac)"}],"step":[{%- for s in t.guide.steps -%}{"@type":"HowToStep","position":{{ forloop.index }},"name":{{ s.title | jsonify }},"text":{{ s.desc | jsonify }},"url":{{ page.url | append: '#step-' | append: forloop.index | absolute_url | jsonify }}}{% unless forloop.last %},{% endunless %}{%- endfor -%}]}
 {%- endif %}
]}
</script>
{%- endif %}
