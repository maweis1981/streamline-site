    need:
    - Một điện thoại hoặc máy tính bảng Android
    - Chrome, hoặc VLC for Android từ Google Play
    - 'Tùy chọn: link danh sách M3U / M3U8 của riêng bạn'
    steps:
    - title: 'Trên Chrome: mở trình phát web'
      desc: Truy cập doubo.tv/web và chạm vào một kênh để xem. Thêm danh sách của riêng bạn bằng Thêm danh sách.
    - title: Thêm vào màn hình chính
      desc: Trong menu ⋮ của Chrome, chọn Add to Home screen để mở trình phát web như một ứng dụng.
    - title: 'Với VLC: mở luồng mạng'
      desc: Cài VLC từ Google Play, mở More → New stream (Stream ở phiên bản cũ) và dán link danh sách.
