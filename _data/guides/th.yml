hub:
  title: คู่มือแยกตามอุปกรณ์
  intro: วิธีเปิดเพลย์ลิสต์ M3U / M3U8 แบบทีละขั้นตอนบนอุปกรณ์ที่คนใช้กันมากที่สุด
labels:
  eyebrow: คู่มืออุปกรณ์
  need: สิ่งที่ต้องมี
  steps: ขั้นตอน
  tips: เคล็ดลับ
  faq: คำถามที่พบบ่อย
  related: อุปกรณ์อื่น
  try_web: ลองในเบราว์เซอร์ก่อน
  try_web_desc: ไม่ต้องติดตั้งอะไร เว็บเพลเยอร์ของ Doubo เปิดช่องถ่ายทอดสดฟรีได้ทันที และเล่นลิงก์ M3U ของคุณเองได้ด้วย
  open_web: เปิดเว็บเพลเยอร์
  free_title: ยังไม่มีเพลย์ลิสต์?
  free_desc: ไดเรกทอรีช่องฟรีของ Doubo รวบรวมช่องที่ผู้แพร่ภาพเปิดให้รับชมได้แบบสาธารณะ เป็นลิงก์ M3U ที่คุณนำไปวางในเพลเยอร์ใดก็ได้
  free_link: ดูช่องฟรี
devices:
  vlc:
    name: VLC
    title: วิธีเปิดเพลย์ลิสต์ M3U ใน VLC (Windows, Mac, Android, iPhone)
    description: วิธีเปิดเพลย์ลิสต์ IPTV แบบ M3U / M3U8 ใน VLC media player บน Windows, macOS, Android และ iOS ทีละขั้นตอน พร้อมชื่อเมนูของแต่ละแพลตฟอร์ม
    intro: VLC เป็นเพลเยอร์ฟรีแบบโอเพนซอร์สที่ใช้ได้แทบทุกแพลตฟอร์ม และเปิดเพลย์ลิสต์ M3U ได้ทั้งจากลิงก์และจากไฟล์ นี่คือวิธีทำบนแต่ละระบบ
    need:
    - VLC media player ดาวน์โหลดฟรีจาก videolan.org หรือ App Store ของอุปกรณ์คุณ
    - ลิงก์หรือไฟล์เพลย์ลิสต์ M3U / M3U8
    steps:
    - title: คัดลอกลิงก์เพลย์ลิสต์
      desc: คัดลอกที่อยู่ M3U ที่ต้องการเปิด เช่น เพลย์ลิสต์รายประเทศจากไดเรกทอรีช่องฟรีของ Doubo
    - title: 'Windows และ Linux: Open Network Stream'
      desc: ใน VLC เลือก Media → Open Network Stream (Ctrl+N) วางลิงก์แล้วคลิก Play หากต้องการเปิดไฟล์ .m3u ที่ดาวน์โหลดไว้ ให้ใช้ Media → Open File แทน
    - title: 'Mac: Open Network'
      desc: เลือก File → Open Network (⌘N) วางลิงก์ในช่อง URL แล้วคลิก Open
    - title: 'Android และ iPhone: สตรีมผ่านเครือข่าย'
      desc: บน Android เปิดแท็บ More แล้วเลือก New stream (ในเวอร์ชันเก่าเรียกว่า Stream) บน iPhone และ iPad เปิดแท็บ Network แล้วเลือก Open Network Stream จากนั้นวางลิงก์และเริ่มเล่น
    - title: เปลี่ยนช่อง
      desc: VLC จะโหลดเพลย์ลิสต์ทั้งหมด บนคอมพิวเตอร์ให้เปิด View → Playlist (Ctrl+L บน Windows) เพื่อดูทุกช่อง แล้วดับเบิลคลิกช่องที่ต้องการเล่น
    tips:
    - หากช่องไม่เริ่มเล่น ให้รอสักครู่หรือเลือกช่องถัดไป สตรีมสดบางครั้งต้องใช้เวลาบัฟเฟอร์
    - บันทึกเพลย์ลิสต์ที่ใช้บ่อยด้วย Media → Save Playlist to File เพื่อเปิดใหม่ได้โดยไม่ต้องใช้ลิงก์
    - VLC แสดงช่องเป็นรายการเรียงต่อกันธรรมดา หากต้องการกลุ่มช่อง รายการโปรด และโลโก้ช่อง ให้ใช้แอปหรือเว็บเพลเยอร์ของ Doubo
    faq:
    - q: VLC เปิดลิงก์ M3U8 ได้ไหม?
      a: ได้ M3U8 คือ M3U เวอร์ชัน UTF-8 และยังใช้กับสตรีมสดแบบ HLS ด้วย VLC เปิดได้ทั้งสองแบบด้วยวิธีเดียวกัน
    - q: ทำไม VLC แสดงแค่ช่องเดียว?
      a: คุณอาจเปิดที่อยู่สตรีมเดี่ยวแทนที่จะเป็นเพลย์ลิสต์ ตรวจสอบว่าลิงก์ชี้ไปที่ไฟล์เพลย์ลิสต์ (มักลงท้ายด้วย .m3u หรือ .m3u8) ที่มีรายชื่อหลายช่อง
  kodi:
    name: Kodi
    title: วิธีเพิ่มเพลย์ลิสต์ M3U ใน Kodi ด้วย PVR IPTV Simple Client
    description: ตั้งค่าทีวีสดใน Kodi จากเพลย์ลิสต์ M3U / M3U8 ด้วยส่วนเสริมทางการ PVR IPTV Simple Client ตั้งแต่ติดตั้ง ใส่ลิงก์เพลย์ลิสต์ ไปจนถึงรับชม
    intro: Kodi เล่นเพลย์ลิสต์ IPTV ผ่านส่วนเสริมทางการ PVR IPTV Simple Client เมื่อตั้งค่าแล้ว ช่องต่าง ๆ จะแสดงในส่วน TV ของ Kodi พร้อมกลุ่มช่อง และผังรายการหากเพลย์ลิสต์ของคุณมีให้
    need:
    - Kodi บน Windows, Mac, Linux, Android, Android TV หรือ Fire TV
    - ลิงก์เพลย์ลิสต์ M3U / M3U8
    steps:
    - title: เปิดหน้าเลือกส่วนเสริม
      desc: ใน Kodi เปิด Settings (ไอคอนรูปเฟือง) → Add-ons → Install from repository → PVR clients
    - title: ติดตั้ง PVR IPTV Simple Client
      desc: เลือก PVR IPTV Simple Client แล้วเลือก Install บางระบบติดตั้งไว้แล้วและแค่ต้องเปิดใช้งาน
    - title: ใส่ลิงก์เพลย์ลิสต์
      desc: เลือก Configure ในส่วน General ตั้งค่า Location เป็น Remote path (Internet address) จากนั้นวางลิงก์ในช่อง M3U play list URL แล้วยืนยันด้วย OK
    - title: เปิดใช้งานส่วนเสริม
      desc: เลือก Enable หากยังไม่ได้เปิด Kodi จะโหลดช่องต่าง ๆ ถ้าช่องยังไม่แสดงทันที ลองรีสตาร์ต Kodi
    - title: รับชม
      desc: ไปที่ TV บนหน้าหลักของ Kodi ช่องจะแสดงแยกตามกลุ่ม และเปิดดูช่องใดก็ได้
    tips:
    - Kodi เวอร์ชันใหม่ให้เพิ่มการตั้งค่าส่วนเสริมได้หลายชุด ชุดละหนึ่งเพลย์ลิสต์
    - หากเพลย์ลิสต์ของคุณลิงก์ไปยังไฟล์ EPG (XMLTV) ให้เพิ่มไว้ในการตั้งค่า EPG ของส่วนเสริมเพื่อรับผังรายการ
    faq:
    - q: ต้องใช้ส่วนเสริมจากบุคคลที่สามไหม?
      a: ไม่ต้อง PVR IPTV Simple Client ดูแลโดยทีม Kodi และเพียงพอสำหรับเพลย์ลิสต์ M3U
    - q: รายการช่องว่างเปล่า ควรตรวจสอบอะไร?
      a: ตรวจสอบว่าตั้งค่า Location เป็น Remote path ลิงก์ครบถ้วน และเปิดใช้งานส่วนเสริมแล้ว จากนั้นรีสตาร์ต Kodi
  smart-tv:
    name: สมาร์ททีวี
    title: วิธีดูเพลย์ลิสต์ M3U บนสมาร์ททีวี (Samsung, LG และยี่ห้ออื่น)
    description: สามวิธีเปิดเพลย์ลิสต์ IPTV แบบ M3U / M3U8 บนสมาร์ททีวี Samsung, LG หรือยี่ห้ออื่น ได้แก่ แอป IPTV player การแคสต์จากมือถือ หรือเบราว์เซอร์ของทีวี
    intro: สมาร์ททีวีส่วนใหญ่เปิดเพลย์ลิสต์ M3U เองไม่ได้ แต่มีสามวิธีง่าย ๆ ที่จะพาช่องของคุณขึ้นจอใหญ่
    need:
    - สมาร์ททีวีที่เชื่อมต่อ Wi-Fi เครือข่ายเดียวกับมือถือหรือคอมพิวเตอร์ของคุณ
    - ลิงก์เพลย์ลิสต์ M3U / M3U8
    steps:
    - title: 'วิธีที่ 1: ติดตั้ง IPTV player บนทีวี'
      desc: เปิดร้านแอปของทีวี (Samsung Smart Hub, LG Content Store เป็นต้น) แล้วค้นหา “IPTV player” หรือ “M3U” เลือกเพลเยอร์ที่เชื่อถือได้ เปิดแอปแล้ววางหรือพิมพ์ลิงก์เพลย์ลิสต์
    - title: 'วิธีที่ 2: แคสต์จากแอป Doubo'
      desc: เปิดช่องใน Doubo บน iPhone, iPad หรือ Mac แตะไอคอนแคสต์ในเพลเยอร์แล้วเลือกทีวีของคุณ สมาร์ททีวีหลายรุ่นรับการแคสต์ผ่าน DLNA ในเครือข่ายเดียวกันได้
    - title: 'วิธีที่ 3: สะท้อนหน้าจอ'
      desc: ทีวี Samsung, LG, Sony และ Vizio หลายรุ่นตั้งแต่ปี 2018 เป็นต้นมารองรับ AirPlay บน iPhone หรือ iPad เปิด Control Center → Screen Mirroring แล้วเลือกทีวี จากนั้นเล่นใน Doubo แบบเต็มจอ
    - title: 'วิธีที่ 4: ใช้เบราว์เซอร์ของทีวี'
      desc: เปิดเว็บเบราว์เซอร์ของทีวีแล้วไปที่ doubo.tv/web ใช้ได้กับทีวีบางรุ่น แต่การแคสต์หรือแอปเพลเยอร์มักลื่นไหลกว่า
    tips:
    - การพิมพ์ลิงก์ยาว ๆ ด้วยรีโมททีวีนั้นช้า แอปทีวีหลายตัวให้พิมพ์จากมือถือแทนได้
    - การต่อสาย Ethernet หรือใช้ Wi-Fi 5 GHz ช่วยให้ช่อง HD เล่นได้ลื่นขึ้น
    faq:
    - q: ทีวี Samsung หรือ LG เล่น M3U ได้โดยไม่ต้องใช้แอปไหม?
      a: โดยทั่วไปไม่ได้ เพลเยอร์ในตัวไม่เปิดเพลย์ลิสต์ IPTV คุณจึงต้องใช้แอปเพลเยอร์ การแคสต์ หรือการสะท้อนหน้าจอ
    - q: วิธีไหนดีที่สุด?
      a: การแคสต์จากมือถือไม่ต้องติดตั้งอะไรบนทีวี จึงลองได้เร็วที่สุด ส่วนแอปเพลเยอร์บนทีวีเหมาะกว่าหากคุณดูทุกวัน
  android-tv:
    name: Android TV / กล่องทีวี
    title: วิธีเปิดเพลย์ลิสต์ M3U บน Android TV, Google TV และกล่องทีวี
    description: เปิดเพลย์ลิสต์ IPTV แบบ M3U / M3U8 บน Android TV, Google TV หรือกล่อง Android TV ด้วยการติดตั้งเพลเยอร์จาก Google Play ใส่ลิงก์ แล้วใช้รีโมทควบคุม
    intro: Android TV, Google TV และกล่อง Android TV ติดตั้ง IPTV player จาก Google Play ได้ นี่คือวิธีตั้งค่าที่ใช้ได้แน่นอนด้วย VLC ซึ่งฟรีและไม่มีโฆษณา
    need:
    - Android TV, Google TV หรือกล่อง Android TV ที่มี Google Play
    - ลิงก์เพลย์ลิสต์ M3U / M3U8
    steps:
    - title: ติดตั้ง VLC
      desc: เปิด Google Play บนทีวี ค้นหา VLC แล้วติดตั้ง VLC for Android
    - title: เพิ่มลิงก์เพลย์ลิสต์
      desc: เปิด VLC ไปที่ Browse → Stream (หรือตัวเลือก network stream ในเวอร์ชันของคุณ) แล้วใส่ลิงก์เพลย์ลิสต์
    - title: เล่นและเปลี่ยนช่อง
      desc: VLC จะโหลดเพลย์ลิสต์ เลือกช่องที่ต้องการเล่น ใช้ปุ่มย้อนกลับบนรีโมทเพื่อกลับไปที่รายการ
    tips:
    - เพื่อไม่ต้องพิมพ์ลิงก์ยาว ๆ ด้วยรีโมท ให้ติดตั้งแอป Google TV หรือแอปคีย์บอร์ดบนมือถือแล้วพิมพ์จากที่นั่น
    - Doubo สำหรับ Android และ Android TV กำลังจะมาเร็ว ๆ นี้ พร้อมกลุ่มช่อง รายการโปรด และการสลับเส้นทางสตรีมอัตโนมัติ
    faq:
    - q: มีแอป Doubo สำหรับ Android TV ไหม?
      a: อยู่ระหว่างพัฒนา ระหว่างนี้คุณใช้ VLC หรือเพลเยอร์อื่น หรือแคสต์จากเว็บเพลเยอร์ของ Doubo ใน Chrome ได้
    - q: การติดตั้งแอป IPTV จากนอก Google Play ปลอดภัยไหม?
      a: แอปจากแหล่งที่ไม่รู้จักอาจมีมัลแวร์หรือเนื้อหาละเมิดลิขสิทธิ์ ควรใช้ Google Play และเพลเยอร์ที่เป็นที่รู้จัก
  fire-tv:
    name: Fire TV Stick
    title: วิธีเปิดเพลย์ลิสต์ M3U บน Amazon Fire TV Stick
    description: ดูเพลย์ลิสต์ IPTV แบบ M3U / M3U8 บน Fire TV Stick หรือ Fire TV ด้วยการติดตั้ง VLC จาก Amazon Appstore เปิดลิงก์เพลย์ลิสต์ แล้วเปลี่ยนช่อง
    intro: อุปกรณ์ Fire TV เล่นเพลย์ลิสต์ M3U ได้ด้วย VLC ซึ่งดาวน์โหลดฟรีใน Amazon Appstore
    need:
    - Amazon Fire TV Stick หรือ Fire TV
    - ลิงก์เพลย์ลิสต์ M3U / M3U8
    steps:
    - title: ติดตั้ง VLC
      desc: จากหน้าหลักของ Fire TV ไปที่ Find → Search พิมพ์ VLC แล้วติดตั้ง VLC for Fire
    - title: เปิด network stream
      desc: เปิด VLC ไปที่ Network หรือ Stream แล้วเลือกเปิด network stream ใส่ลิงก์เพลย์ลิสต์
    - title: รับชม
      desc: VLC จะโหลดช่องในเพลย์ลิสต์ เลือกช่องที่ต้องการเล่น
    tips:
    - การพิมพ์ด้วยรีโมทนั้นช้า แอป Amazon Fire TV บนมือถือมีคีย์บอร์ดให้ใช้แทนได้
    - Fire TV ที่ต่อ Ethernet (หรือใช้อะแดปเตอร์ Ethernet) ช่วยให้สตรีม HD ดีขึ้น
    faq:
    - q: ต้อง sideload อะไรไหม?
      a: ไม่ต้อง VLC มีใน Amazon Appstore จึงไม่ต้องติดตั้งอะไรจากแหล่งภายนอก
    - q: ใช้ Kodi บน Fire TV แทนได้ไหม?
      a: ได้ Kodi พร้อม PVR IPTV Simple Client ใช้งานบน Fire TV ได้ ดูคู่มือ Kodi
  apple-tv:
    name: Apple TV
    title: วิธีดูเพลย์ลิสต์ M3U บน Apple TV
    description: สองวิธีเปิดเพลย์ลิสต์ IPTV แบบ M3U / M3U8 บน Apple TV คือ AirPlay จาก Doubo บน iPhone, iPad หรือ Mac หรือใช้ VLC for tvOS เปิด network stream
    intro: Apple TV ไม่มี IPTV player ในตัว แต่คุณ AirPlay ช่องจาก Doubo บน iPhone, iPad หรือ Mac หรือใช้ VLC for tvOS ได้
    need:
    - Apple TV ที่อยู่ในเครือข่ายเดียวกับ iPhone, iPad หรือ Mac ของคุณ
    - ลิงก์เพลย์ลิสต์ M3U / M3U8
    steps:
    - title: 'วิธีที่ 1: AirPlay จาก Doubo'
      desc: เปิดช่องใน Doubo บน iPhone, iPad หรือ Mac แล้วเลือก Apple TV ของคุณผ่าน Screen Mirroring (Control Center บน iPhone และ iPad หรือแถบเมนูบน Mac) หรือผ่านปุ่ม AirPlay เมื่อเพลเยอร์แสดงปุ่มนี้
    - title: 'วิธีที่ 2: ติดตั้ง VLC บน Apple TV'
      desc: เปิด App Store บน Apple TV ค้นหา VLC แล้วติดตั้ง
    - title: เปิดเพลย์ลิสต์ใน VLC
      desc: ใน VLC เปิดแท็บ Network Stream แล้วใส่ลิงก์เพลย์ลิสต์ VLC จะโหลดช่องต่าง ๆ
    tips:
    - แท็บ Remote Playback ของ VLC ให้คุณส่งไฟล์เพลย์ลิสต์จากเบราว์เซอร์บนคอมพิวเตอร์ในเครือข่ายเดียวกันได้โดยไม่ต้องพิมพ์
    - มีแผนจะออกแอป Doubo สำหรับ Apple TV
    faq:
    - q: มีแอป Doubo สำหรับ Apple TV ไหม?
      a: อยู่ในแผนพัฒนา ตอนนี้วิธีที่ง่ายที่สุดคือ AirPlay จาก Doubo บน iPhone, iPad หรือ Mac
    - q: AirPlay ยังเล่นต่อไหมถ้าล็อก iPhone?
      a: การสะท้อนหน้าจอจะหยุดเมื่อล็อกมือถือ จึงควรปลดล็อกค้างไว้ หรือใช้ VLC บน Apple TV สำหรับการดูนาน ๆ
  chromecast:
    name: Chromecast / Google TV
    title: วิธีแคสต์เพลย์ลิสต์ M3U ไปยัง Chromecast และ Google TV
    description: ส่งช่องสดจากเพลย์ลิสต์ M3U / M3U8 ไปยัง Chromecast หรือ Google TV ด้วยการแคสต์แท็บจาก Chrome ผ่านเว็บเพลเยอร์ของ Doubo หรือแคสต์จาก VLC บน Android
    intro: Chromecast เปิดเพลย์ลิสต์เองไม่ได้ แต่คอมพิวเตอร์หรือมือถือส่งช่องไปยัง Chromecast ได้ด้วยการแตะไม่กี่ครั้ง
    need:
    - Chromecast หรือ Google TV ที่เชื่อมต่อ Wi-Fi เครือข่ายเดียวกัน
    - Google Chrome บนคอมพิวเตอร์ หรือมือถือ Android
    - ลิงก์เพลย์ลิสต์ M3U / M3U8
    steps:
    - title: เปิดเว็บเพลเยอร์ใน Chrome
      desc: บนคอมพิวเตอร์ เปิด doubo.tv/web ใน Chrome เลือกช่องฟรีหรือเพิ่มลิงก์เพลย์ลิสต์ของคุณเอง
    - title: แคสต์แท็บ
      desc: เปิดเมนู ⋮ ของ Chrome → Cast (บางเวอร์ชันอยู่ใต้ Save and share) เลือก Chromecast ของคุณ แล้วเล่นช่องแบบเต็มจอ
    - title: 'จากมือถือ Android: VLC'
      desc: เปิดเพลย์ลิสต์ใน VLC for Android เริ่มเล่นช่อง แตะไอคอนแคสต์ แล้วเลือก Chromecast ของคุณ
    tips:
    - เปิดแท็บที่แคสต์ไว้ด้านหน้าบนคอมพิวเตอร์เพื่อการเล่นที่ลื่นไหลที่สุด
    - Google TV ติดตั้ง VLC ได้โดยตรงเช่นกัน ดูคู่มือ Android TV
    faq:
    - q: การแคสต์แท็บ Chrome ทำให้คุณภาพลดลงไหม?
      a: การแคสต์แท็บจะเข้ารหัสภาพใหม่ คุณภาพจึงขึ้นอยู่กับคอมพิวเตอร์และ Wi-Fi ของคุณ หากต้องการคุณภาพดีที่สุด ให้ติดตั้งเพลเยอร์บน Google TV
    - q: แคสต์จาก iPhone ไปยัง Chromecast ได้ไหม?
      a: Chromecast ไม่รองรับ AirPlay ให้ใช้คอมพิวเตอร์ที่มี Chrome หรือมือถือ Android แทน
  iphone-ipad:
    name: iPhone และ iPad
    title: วิธีเปิดเพลย์ลิสต์ M3U บน iPhone และ iPad
    description: เปิดเพลย์ลิสต์ IPTV แบบ M3U / M3U8 บน iPhone และ iPad ด้วย Doubo เพิ่มลิงก์หรือไฟล์ ดูตามกลุ่มช่อง รับชมแบบ Picture in Picture และแคสต์ขึ้นทีวี
    intro: Doubo เป็น IPTV player แบบเนทีฟสำหรับ iPhone และ iPad อ่านกลุ่มช่องและโลโก้จากเพลย์ลิสต์ของคุณ และดูต่อได้แบบ Picture in Picture ขณะใช้แอปอื่น
    need:
    - iPhone หรือ iPad ที่ใช้ iOS / iPadOS 17 ขึ้นไป
    - แอป Doubo
    - ลิงก์หรือไฟล์เพลย์ลิสต์ M3U / M3U8
    steps:
    - title: เพิ่มเพลย์ลิสต์
      desc: เปิด Doubo แตะ Add แล้ววางลิงก์ M3U หรือนำเข้าไฟล์ .m3u / .m3u8 จากแอป Files
    - title: เลือกดูและค้นหา
      desc: ช่องจะถูกจัดกลุ่มให้อัตโนมัติ ค้นหาด้วยชื่อช่องหรือชื่อกลุ่ม และติดดาวช่องที่ดูบ่อย
    - title: รับชมไปพร้อมทำอย่างอื่น
      desc: แตะช่องเพื่อเล่น ปัดกลับหน้าโฮมเพื่อดูต่อแบบ Picture in Picture
    - title: ขึ้นจอทีวี
      desc: ใช้ไอคอนแคสต์เพื่อส่งช่องไปยังสมาร์ททีวีที่รองรับ DLNA หรือใช้ Screen Mirroring ใน Control Center สำหรับ Apple TV หรือทีวีที่รองรับ AirPlay
    tips:
    - ยังไม่มีแอป? เปิด doubo.tv/web ใน Safari เพื่อดูช่องฟรีได้ทันที
    - Doubo เก็บเพลย์ลิสต์ไว้บนอุปกรณ์ของคุณเท่านั้น ไม่มีการอัปโหลดใด ๆ
    faq:
    - q: Safari เปิดเพลย์ลิสต์ M3U ได้ไหม?
      a: Safari เล่นสตรีม HLS เดี่ยวได้ แต่เปิดเพลย์ลิสต์ IPTV ทั้งชุดไม่ได้ ให้ใช้เว็บเพลเยอร์ของ Doubo ที่ doubo.tv/web หรือแอป Doubo
    - q: Doubo มีช่องให้ด้วยไหม?
      a: แอปเป็นเพลเยอร์ คุณต้องเพิ่มเพลย์ลิสต์เอง ส่วนเว็บเพลเยอร์และไดเรกทอรีช่องฟรีมีช่องฟรีที่เปิดให้รับชมแบบสาธารณะ
  computer:
    name: คอมพิวเตอร์ (เบราว์เซอร์)
    title: วิธีเปิดเพลย์ลิสต์ M3U ออนไลน์ผ่านเบราว์เซอร์ (Windows และ Mac)
    description: เปิดเพลย์ลิสต์ IPTV แบบ M3U / M3U8 ออนไลน์ใน Chrome, Edge, Safari หรือ Firefox โดยไม่ต้องติดตั้ง พร้อมช่องฟรี ลิงก์ของคุณเอง กลุ่มช่อง การค้นหา และ Picture in Picture
    intro: วิธีที่เร็วที่สุดในการดูเพลย์ลิสต์ M3U บนคอมพิวเตอร์คือผ่านเบราว์เซอร์ เว็บเพลเยอร์ของ Doubo ไม่ต้องติดตั้งและไม่ต้องสมัครบัญชี
    need:
    - Chrome, Edge, Safari หรือ Firefox บน Windows, macOS หรือ Linux
    - ไม่บังคับ — ลิงก์หรือไฟล์เพลย์ลิสต์ M3U / M3U8 ของคุณเอง
    steps:
    - title: เปิดเว็บเพลเยอร์
      desc: ไปที่ doubo.tv/web ช่องสดฟรีจำนวนมากจะโหลดขึ้นมาทันที พร้อมภาพตัวอย่างแบบไม่มีเสียง
    - title: เลือกช่อง
      desc: กรองตามประเทศหรือหมวดหมู่ หรือค้นหาด้วยชื่อ คลิกที่ไทล์เพื่อดูพร้อมเสียง ภาพตัวอย่างอื่นจะหยุด
    - title: เพิ่มเพลย์ลิสต์ของคุณเอง
      desc: คลิก Add playlist แล้ววางลิงก์ นำเข้าไฟล์ หรือวางข้อความเพลย์ลิสต์ ข้อมูลจะบันทึกไว้ในเบราว์เซอร์ของคุณเท่านั้น
    - title: เต็มจอและ Picture in Picture
      desc: กด F เพื่อดูเต็มจอ หรือ P เพื่อ Picture in Picture และใช้ ↑ ↓ เพื่อเปลี่ยนช่อง
    tips:
    - ช่องที่เบราว์เซอร์เล่นไม่ได้จะถูกซ่อนอัตโนมัติ แอป Doubo เล่นช่องเหล่านี้ได้มากกว่า
    - บน Mac แอป Doubo มีเพลเยอร์แบบเนทีฟพร้อม Picture in Picture และการจัดการเพลย์ลิสต์
    faq:
    - q: ใช้ฟรีไหม?
      a: ฟรี เว็บเพลเยอร์ใช้งานได้ฟรีและไม่ต้องสมัครบัญชี
    - q: ใช้ VLC แทนได้ไหม?
      a: ได้แน่นอน ดูคู่มือ VLC สำหรับ Windows และ Mac
  android-phone:
    name: มือถือ Android
    title: วิธีเปิดเพลย์ลิสต์ M3U บนมือถือ Android
    description: ดูเพลย์ลิสต์ IPTV แบบ M3U / M3U8 บนมือถือหรือแท็บเล็ต Android ด้วยเว็บเพลเยอร์ของ Doubo ใน Chrome โดยไม่ต้องติดตั้ง หรือใช้ VLC for Android
    intro: บน Android คุณดูได้ทันทีใน Chrome ด้วยเว็บเพลเยอร์ของ Doubo หรือใช้ VLC for Android ส่วนแอป Doubo แบบเนทีฟสำหรับ Android กำลังจะมาเร็ว ๆ นี้
    need:
    - มือถือหรือแท็บเล็ต Android
    - Chrome หรือ VLC for Android จาก Google Play
    - ไม่บังคับ — ลิงก์เพลย์ลิสต์ M3U / M3U8 ของคุณเอง
    steps:
    - title: 'ใน Chrome: เปิดเว็บเพลเยอร์'
      desc: ไปที่ doubo.tv/web แล้วแตะช่องเพื่อรับชม เพิ่มเพลย์ลิสต์ของคุณเองด้วย Add playlist
    - title: เพิ่มลงในหน้าจอโฮม
      desc: ในเมนู ⋮ ของ Chrome เลือก Add to Home screen เพื่อเปิดเว็บเพลเยอร์ได้เหมือนแอป
    - title: 'ด้วย VLC: เปิด network stream'
      desc: ติดตั้ง VLC จาก Google Play เปิด More → New stream (ในเวอร์ชันเก่าคือ Stream) แล้ววางลิงก์เพลย์ลิสต์
    tips:
    - การดูวิดีโอสดใช้อินเทอร์เน็ตมือถือเปลืองอย่างรวดเร็ว ใช้ Wi-Fi เมื่อทำได้
    - Doubo สำหรับ Android กำลังจะมาเร็ว ๆ นี้ พร้อมกลุ่มช่อง รายการโปรด และการสลับเส้นทางสตรีมอัตโนมัติ
    faq:
    - q: มีแอป Doubo บน Google Play ไหม?
      a: ยังไม่มี อยู่ระหว่างพัฒนา ระหว่างนี้ใช้เว็บเพลเยอร์ได้
    - q: ทำไมบางช่องเล่นใน VLC ได้แต่เล่นในเบราว์เซอร์ไม่ได้?
      a: เบราว์เซอร์บล็อกสตรีมบางประเภทด้วยเหตุผลด้านความปลอดภัย เพลเยอร์แบบเนทีฟอย่าง VLC หรือแอป Doubo ไม่มีข้อจำกัดเหล่านี้
