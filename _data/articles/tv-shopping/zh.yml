faq:
  - q: 为了调研去看国外的电视购物频道合法吗？
    a: 合法。这里列出的频道都由电视台向公众免费播出。看到的内容请仅用于调研，并尊重商品和画面的商标与版权。
  - q: 哪些国家有免费的电视购物频道？
    a: 本页表格按国家列出了都播免费目录中的所有购物频道，并且每天随着频道的增减自动更新。
  - q: 看多久才能确定选品？
    a: 一般连续两到三周、每周看几次，就能看出哪些商品在反复主推。之后再用同一市场的电商平台和搜索数据确认需求。
