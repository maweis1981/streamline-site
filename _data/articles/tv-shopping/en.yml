faq:
  - q: Is it legal to watch foreign TV shopping channels for research?
    a: Yes. The channels listed here stream free to the public from their broadcasters. Use what you learn as research and respect the trademarks and copyrights of the products and footage.
  - q: Which countries have free TV shopping channels?
    a: The table on this page lists every shopping channel in Doubo’s free directory, grouped by country, and it updates daily as channels are added or go off air.
  - q: How long should I watch before choosing a product?
    a: A few sessions a week over two to three weeks is usually enough to see which products repeat. Then confirm demand with marketplace and search data in the same market.
