faq:
  - q: Xem kênh mua sắm truyền hình nước ngoài để nghiên cứu có hợp pháp không?
    a: Có. Các kênh được liệt kê ở đây được đài phát sóng phát trực tuyến miễn phí cho công chúng. Hãy dùng những gì bạn học được làm nghiên cứu và tôn trọng nhãn hiệu cũng như bản quyền của sản phẩm và cảnh quay.
  - q: Những quốc gia nào có kênh mua sắm truyền hình miễn phí?
    a: Bảng trên trang này liệt kê mọi kênh mua sắm trong danh mục miễn phí của Doubo, nhóm theo quốc gia, và được cập nhật hằng ngày khi có kênh mới được thêm hoặc ngừng phát sóng.
  - q: Nên xem bao lâu trước khi chọn sản phẩm?
    a: Vài buổi mỗi tuần trong hai đến ba tuần thường là đủ để thấy sản phẩm nào lặp lại. Sau đó hãy xác nhận nhu cầu bằng dữ liệu từ sàn thương mại điện tử và dữ liệu tìm kiếm tại cùng thị trường.
