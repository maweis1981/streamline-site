faq:
  title: FAQ
  items:
  - q: Does Doubo provide TV channels?
    a: No. Doubo is a player; it doesn't bundle or sell channel content. Add playlists you're authorized to use. Recommended lists in the app are third-party public links, and their availability and viewing rights are set by their providers.
  - q: How do I get started?
    a: Tap Add, paste an M3U / M3U8 playlist URL you’re authorized to use, or import a .m3u / .m3u8 file from Files. Channels are grouped automatically. See the Guide page for step-by-step instructions.
  - q: Which formats are supported?
    a: M3U and M3U8 playlists, with live streams such as HLS (.m3u8) that Apple’s native player supports. You can also open local video files directly.
  - q: Do you collect my data?
    a: The app collects no personal data. Playlists, favorites, and watch history stay on your device. This website uses Google Analytics to understand visits; see the privacy policy.
  - q: What do I need to cast to a TV?
    a: The TV must support DLNA rendering (DMR) and be on the same network. Automatic discovery on iPhone and iPad requires Apple's multicast networking entitlement, which is still pending; Mac isn't affected.
  - q: Is there an Android version?
    a: It’s on the way. Doubo for Android will support phones, tablets, and Android TV / TV boxes, and we’ll announce it here as soon as it’s available.
  - q: Does it work on Apple TV?
    a: An Apple TV version is planned. Today Doubo runs on iPhone, iPad, and Mac, and you can cast to your living-room TV.
