guide:
  title: Guide
  subtitle: 'Get started in three minutes: play M3U / M3U8 playlists on iPhone, iPad, and Mac.'
  description: 'How to use Doubo: add M3U / M3U8 playlists on iPhone, iPad, and Mac, browse channels, watch in Picture in Picture, and cast to your TV.'
  intro: Before you start, have an M3U / M3U8 playlist URL or file that you’re authorized to use. Doubo is a player and doesn’t provide any channels.
  steps:
  - title: Add a playlist
    desc: Open Doubo and tap Add. Choose “Add playlist URL” to paste an M3U address, or “Import playlist file” to import a .m3u / .m3u8 file from the Files app.
  - title: Browse, search, and favorite
    desc: Channels are grouped by group-title automatically. Search channel or group names at the top, star the channels you watch most, and find recently played channels anytime.
  - title: Organize channels in one tap
    desc: Tap “Check channels” and Doubo tests the whole playlist in parallel, so you can show just the channels that are ready to play.
  - title: Play and Picture in Picture
    desc: Tap a channel to play. Enjoy Picture in Picture, subtitle tracks, playback speed, and landscape full screen, and keep watching while you use other apps.
  - title: Cast to your TV
    desc: Tap the cast icon in the player and choose a DLNA smart TV on the same network to watch on the big screen.
  - title: Manage multiple playlists
    desc: Your last 20 playlists are saved on your device. Doubo reopens the one you watched last, and you can switch anytime.
  tips_title: Tips
  tips:
  - Playlists must be in M3U or M3U8 format; channel addresses usually start with http(s)://.
  - When a channel has several sources, switch between them under Lines.
  - Playlists, favorites, and history stay on your device, and you can clear them anytime in Settings.
  cta: More questions? See the FAQ or contact us
