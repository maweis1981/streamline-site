features:
  eyebrow: Features
  title: Smooth from import to watching
  subtitle: Built natively, so it stays light, smooth, and easy on your battery.
  items:
  - icon: import
    title: Import any M3U playlist
    desc: Add a URL or a local .m3u / .m3u8 file. Channel names, groups, and logos are parsed automatically, and your last 20 playlists are remembered and restored at launch.
  - icon: grid
    title: Groups, search, and favorites
    desc: Browse by group-title, search channel names and groups instantly, star the channels you watch, and jump back through recently played.
  - icon: pulse
    title: Check every channel at once
    desc: Doubo tests your whole playlist in parallel and lines up the channels that are ready to play, so you can just press play.
  - icon: route
    title: Switch lines in one tap
    desc: When a channel has several sources, switch between them under Lines and pick the smoothest one anytime.
  - icon: pip
    title: A native playback experience
    desc: Built on AVKit, with Picture in Picture, subtitle tracks, playback speed, and landscape full screen. The playing channel's row shows a live frame.
  - icon: cast
    title: Cast to your TV
    desc: Cast to DLNA smart TVs on the same network, or open a local video file to play it directly.
  - icon: lock
    title: Privacy first
    desc: Playlists, favorites, and history stay on your device. The app has no ad or analytics SDKs and collects no personal data.
