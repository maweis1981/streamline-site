faq:
  title: FAQ
  items:
    - q: Does Doubo provide TV channels?
      a: No. Doubo is a player; it doesn't bundle or sell channel content. Add playlists you're authorized to use. Recommended lists in the app are third-party public links, and their availability and viewing rights are set by their providers.
    - q: Why won't some channels play?
      a: A stream may be offline, need an account, be region-restricted, or use a codec Apple's player doesn't support. Doubo tries to identify the reason and shows it on the channel's row. The check feature filters out unreachable channels ahead of time.
    - q: Do you collect my data?
      a: The app collects no personal data. Playlists, favorites, and watch history stay on your device. This website uses Google Analytics to understand visits; see the privacy policy.
    - q: What do I need to cast to a TV?
      a: The TV must support DLNA rendering (DMR) and be on the same network. Automatic discovery on iPhone and iPad requires Apple's multicast networking entitlement, which is still pending; Mac isn't affected.

