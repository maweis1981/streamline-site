  features:
  - t: Nothing to install
    d: Works in Chrome, Edge, Safari, Firefox and other modern browsers.
  - t: Groups and search
    d: Reads the groups in your playlist so you can find a channel among thousands.
  - t: Automatic route switching
    d: Channels with several stream links are merged, and the player moves to the next link when one does not start.
  - t: Private by design
    d: Playlists stay in your browser. Nothing is uploaded or collected.
  faq_title: Frequently asked questions
  faq:
  - q: Is the web player free? Do I need an account?
    a: It is completely free and needs no account. Open the page, add a playlist and start watching.
  - q: Which playlist formats are supported?
    a: M3U and M3U8 playlists, including IPTV lists with tvg-id, tvg-logo and group-title attributes. Live streams are played over HLS (.m3u8).
  - q: Where is my playlist stored?
    a: Only in your current browser’s local storage. It is never uploaded. If you switch browsers or clear site data, add it again.
  - q: Why are some channels best watched in the app?
    a: For security reasons browsers restrict some live streams, such as http links or routes that need special request headers. The Doubo app has no such limits and also supports casting and background playback.
