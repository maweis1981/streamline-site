  faq:
  - q: Trình phát web có miễn phí không? Có cần tài khoản không?
    a: Hoàn toàn miễn phí và không cần tài khoản. Mở trang, thêm danh sách phát và bắt đầu xem.
  - q: Hỗ trợ định dạng danh sách phát nào?
    a: Danh sách phát M3U và M3U8, kể cả danh sách IPTV có thuộc tính tvg-id, tvg-logo và group-title. Luồng trực tiếp được phát qua HLS (.m3u8).
  - q: Danh sách phát của tôi được lưu ở đâu?
    a: Chỉ trong bộ nhớ cục bộ của trình duyệt hiện tại và không bao giờ được tải lên. Nếu đổi trình duyệt hoặc xóa dữ liệu trang, hãy thêm lại.
  - q: Vì sao một số kênh nên xem trên ứng dụng?
    a: Vì lý do bảo mật, trình duyệt hạn chế một số luồng trực tiếp, chẳng hạn liên kết http hoặc luồng cần tiêu đề yêu cầu đặc biệt. Ứng dụng Doubo không bị giới hạn này và còn hỗ trợ truyền lên TV, phát nền.
