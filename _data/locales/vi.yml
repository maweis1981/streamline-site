features:
  eyebrow: Tính năng
  title: Mượt mà từ lúc nhập đến lúc xem
  subtitle: Phát triển gốc nên nhẹ, mượt và tiết kiệm pin.
  items:
  - icon: import
    title: Nhập mọi danh sách phát M3U
    desc: Thêm URL hoặc tệp .m3u / .m3u8 trên máy. Tên kênh, nhóm và logo được phân tích tự động; 20 danh sách gần nhất được ghi nhớ và khôi phục khi mở ứng dụng.
  - icon: grid
    title: Nhóm, tìm kiếm và yêu thích
    desc: Duyệt theo group-title, tìm tên kênh và nhóm tức thì, đánh dấu kênh yêu thích và quay lại kênh vừa xem.
  - icon: pulse
    title: Kiểm tra mọi kênh cùng lúc
    desc: Doubo kiểm tra song song toàn bộ danh sách phát và sắp xếp sẵn các kênh sẵn sàng phát, bạn chỉ việc bấm xem.
  - icon: route
    title: Đổi đường truyền chỉ một chạm
    desc: Khi một kênh có nhiều nguồn, chuyển đổi giữa chúng ở mục Đường truyền và chọn nguồn mượt nhất bất cứ lúc nào.
  - icon: pip
    title: Trải nghiệm phát gốc
    desc: Xây dựng trên AVKit, có Hình trong hình, chọn phụ đề, tốc độ phát và toàn màn hình khi xoay ngang. Dòng kênh đang phát hiển thị hình ảnh trực tiếp.
  - icon: cast
    title: Truyền lên TV
    desc: Truyền tới smart TV hỗ trợ DLNA trong cùng mạng, hoặc mở tệp video trên máy để phát trực tiếp.
  - icon: lock
    title: Ưu tiên quyền riêng tư
    desc: Danh sách phát, mục yêu thích và lịch sử luôn nằm trên thiết bị. Ứng dụng không có SDK quảng cáo hay phân tích và không thu thập dữ liệu cá nhân.
