faq:
  title: Câu hỏi thường gặp
  items:
  - q: Doubo có cung cấp kênh truyền hình không?
    a: Không. Doubo là trình phát; ứng dụng không kèm sẵn hay bán nội dung kênh. Hãy thêm danh sách phát mà bạn được phép sử dụng. Các danh sách đề xuất trong ứng dụng là liên kết công khai của bên thứ ba; khả năng truy cập và quyền xem do nhà cung cấp quyết định.
  - q: Bắt đầu sử dụng như thế nào?
    a: Chạm Thêm, dán URL danh sách phát M3U / M3U8 mà bạn được phép sử dụng, hoặc nhập tệp .m3u / .m3u8 từ ứng dụng Tệp. Các kênh sẽ được tự động chia nhóm. Xem trang Hướng dẫn để biết từng bước.
  - q: Hỗ trợ những định dạng nào?
    a: Danh sách phát M3U và M3U8, cùng các luồng trực tiếp như HLS (.m3u8) mà trình phát gốc của Apple hỗ trợ. Bạn cũng có thể mở trực tiếp tệp video trên máy.
  - q: Ứng dụng có thu thập dữ liệu của tôi không?
    a: Ứng dụng không thu thập dữ liệu cá nhân. Danh sách phát, mục yêu thích và lịch sử xem luôn nằm trên thiết bị của bạn. Trang web này dùng Google Analytics để hiểu lượt truy cập; xem chính sách quyền riêng tư.
  - q: Cần gì để truyền lên TV?
    a: TV phải hỗ trợ DLNA renderer (DMR) và kết nối cùng mạng. Tự động tìm thiết bị trên iPhone và iPad cần quyền mạng multicast của Apple, hiện vẫn đang chờ cấp; Mac không bị ảnh hưởng.
  - q: Có phiên bản Android không?
    a: Sắp có. Doubo cho Android sẽ hỗ trợ điện thoại, máy tính bảng và Android TV / TV box, và chúng tôi sẽ thông báo tại đây ngay khi ra mắt.
  - q: Có dùng được trên Apple TV không?
    a: Phiên bản Apple TV đang được lên kế hoạch. Hiện Doubo chạy trên iPhone, iPad và Mac, và bạn có thể truyền lên TV phòng khách.
