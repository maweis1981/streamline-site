  - t: Nhóm và tìm kiếm
    d: Đọc các nhóm trong danh sách phát để bạn tìm kênh nhanh dù có hàng nghìn kênh.
  - t: Tự động đổi luồng
    d: Kênh có nhiều liên kết được gộp lại, và trình phát tự chuyển sang liên kết tiếp theo khi một liên kết không chạy.
