guide:
  title: Hướng dẫn
  subtitle: 'Bắt đầu trong ba phút: phát danh sách M3U / M3U8 trên iPhone, iPad và Mac.'
  description: 'Hướng dẫn dùng Doubo: thêm danh sách phát M3U / M3U8 trên iPhone, iPad và Mac, duyệt kênh, xem bằng Hình trong hình và truyền lên TV.'
  intro: Trước khi bắt đầu, hãy chuẩn bị URL hoặc tệp danh sách phát M3U / M3U8 mà bạn được phép sử dụng. Doubo là trình phát và không cung cấp kênh nào.
  steps:
  - title: Thêm danh sách phát
    desc: Mở Doubo và chạm Thêm. Chọn “Thêm URL danh sách phát” để dán địa chỉ M3U, hoặc “Nhập tệp danh sách phát” để nhập tệp .m3u / .m3u8 từ ứng dụng Tệp.
  - title: Duyệt, tìm kiếm và yêu thích
    desc: Các kênh được tự động chia nhóm theo group-title. Tìm tên kênh hoặc nhóm ở phía trên, gắn sao cho kênh hay xem và mở lại kênh vừa xem bất cứ lúc nào.
  - title: Sắp xếp kênh chỉ một chạm
    desc: Chạm “Kiểm tra kênh”, Doubo sẽ kiểm tra song song toàn bộ danh sách để bạn chỉ hiển thị các kênh sẵn sàng phát.
  - title: Phát và Hình trong hình
    desc: Chạm vào kênh để phát. Dùng Hình trong hình, phụ đề, tốc độ phát và toàn màn hình khi xoay ngang, vẫn tiếp tục xem khi dùng ứng dụng khác.
  - title: Truyền lên TV
    desc: Chạm biểu tượng truyền trong trình phát và chọn smart TV hỗ trợ DLNA cùng mạng để xem trên màn hình lớn.
  - title: Quản lý nhiều danh sách phát
    desc: 20 danh sách phát gần nhất được lưu trên thiết bị. Doubo tự mở lại danh sách bạn xem lần trước, và bạn có thể chuyển đổi bất cứ lúc nào.
  tips_title: Mẹo
  tips:
  - Danh sách phát phải ở định dạng M3U hoặc M3U8; địa chỉ kênh thường bắt đầu bằng http(s)://.
  - Khi một kênh có nhiều nguồn, hãy chuyển đổi ở mục Đường truyền.
  - Danh sách phát, mục yêu thích và lịch sử luôn nằm trên thiết bị của bạn, có thể xóa bất cứ lúc nào trong Cài đặt.
