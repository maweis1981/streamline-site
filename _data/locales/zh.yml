faq:
  title: 常见问题
  items:
    - q: Streamline 提供电视频道吗？
      a: 不提供。Streamline 是播放器，不内置、不出售任何频道内容。你需要添加自己有权使用的播放列表。App 中的推荐列表均为第三方公开链接，可用性与观看权限由其提供方决定。
    - q: 为什么有些频道无法播放？
      a: 直播源可能已失效、需要账号授权、有地区限制，或使用了 Apple 播放器不支持的编码。Streamline 会尽量识别具体原因并显示在频道行上。“检测”功能可以帮你提前筛掉无法访问的频道。
    - q: 会收集我的数据吗？
      a: App 不收集个人数据，播放列表、收藏和观看历史只保存在你的设备上。本网站使用 Google Analytics 了解访问情况，详见隐私政策。
    - q: 投屏到电视需要什么条件？
      a: 电视需要支持 DLNA 接收（DMR），并与设备连接同一网络。iPhone / iPad 上的自动发现需要 Apple 的多播网络权限，目前仍在申请中；Mac 不受此限制。

