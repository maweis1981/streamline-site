features:
  eyebrow: 功能
  title: 从导入到观看，每一步都更省心
  subtitle: 只用 Apple 原生框架构建，轻量、流畅、省电。
  items:
    - icon: import
      title: 导入任何 M3U 播放列表
      desc: 支持 URL 与本地 .m3u / .m3u8 文件，自动解析频道名、分组与台标，并记住最近 20 个播放列表，启动时自动恢复。
    - icon: grid
      title: 分组、搜索与收藏
      desc: 按 group-title 分组浏览，频道名与分组即时搜索；收藏常看频道，最近播放一键回到。
    - icon: pulse
      title: 先检测，再播放
      desc: 并发探测每个频道源，只显示可访问的频道，告别一个个点开试错。
    - icon: diagnose
      title: 看得懂的失败原因
      desc: 区分鉴权（401）、地区或访问限制（403）、源已下架（404）、超时、DNS 与格式不兼容，告诉你下一步该怎么做。
    - icon: route
      title: 同名频道一键换线
      desc: 同一频道在列表中有多个来源时，在“线路”中直接切换，并显示每条线路的检测结果。
    - icon: pip
      title: 原生播放体验
      desc: 基于 AVKit：画中画、字幕轨道、倍速播放、横屏全屏，频道行内显示正在播放的实时画面。
    - icon: cast
      title: 投放到电视
      desc: 支持 DLNA 投屏到同一网络下的智能电视；也可以直接打开本地视频文件播放。
    - icon: lock
      title: 隐私优先
      desc: 播放列表、收藏与历史只保存在本机。App 不内置广告和统计 SDK，也不收集任何个人数据。

