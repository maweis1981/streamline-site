guide:
  title: 使用指南
  subtitle: 三分钟上手：在 iPhone、iPad 和 Mac 上播放 M3U / M3U8 播放列表。
  description: 都播使用指南：如何在 iPhone、iPad 和 Mac 上添加 M3U / M3U8 播放列表、浏览频道、画中画观看并投屏到电视。
  intro: 开始之前，请准备一个你有权使用的 M3U / M3U8 播放列表地址或文件。都播是播放器，不提供任何频道内容。
  steps:
  - title: 添加播放列表
    desc: 打开都播，点击「添加」。选择「添加播放列表 URL」粘贴 M3U 地址，或选择「导入播放列表文件」，从“文件”App 导入 .m3u / .m3u8 文件。
  - title: 浏览、搜索与收藏
    desc: 频道会按 group-title 自动分组。顶部可以搜索频道名或分组名，点星标把常看的频道加入收藏，最近播放也会自动记录。
  - title: 一键整理频道
    desc: 点击「检测可播放」，都播会并发检测整个列表，并可以只显示可播放的频道，打开就能看。
  - title: 播放与画中画
    desc: 点击频道即可播放。支持画中画、字幕轨道、倍速播放和横屏全屏，切到其他 App 时也能继续看。
  - title: 投屏到电视
    desc: 在播放器上点击投屏图标，选择同一网络下支持 DLNA 的智能电视，在客厅大屏上观看。
  - title: 管理多个播放列表
    desc: 最近 20 个播放列表会自动保存在本机，下次打开时自动恢复上次观看的列表，也可以随时切换。
  tips_title: 小贴士
  tips:
  - 播放列表需为 M3U 或 M3U8 格式，频道地址通常以 http(s):// 开头。
  - 同名频道有多个来源时，可以在「线路」中一键切换。
  - 播放列表、收藏和历史只保存在你的设备上，可在设置中随时清除。
  cta: 还有问题？查看常见问题或联系我们
