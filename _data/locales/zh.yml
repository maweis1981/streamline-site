faq:
  title: 常见问题
  items:
    - q: 都播提供电视频道吗？
      a: 不提供。都播是播放器，不内置、不出售任何频道内容。你需要添加自己有权使用的播放列表。App 中的推荐列表均为第三方公开链接，可用性与观看权限由其提供方决定。
    - q: 如何开始使用？
      a: 点击「添加」，粘贴你有权使用的 M3U / M3U8 播放列表地址，或从“文件”导入 .m3u / .m3u8 文件，频道会自动按分组排好。详细步骤见「使用指南」页面。
    - q: 支持哪些格式？
      a: 支持 M3U 和 M3U8 播放列表，可播放 HLS（.m3u8）等 Apple 原生播放器支持的直播流，也可以直接打开本地视频文件。
    - q: 会收集我的数据吗？
      a: App 不收集个人数据，播放列表、收藏和观看历史只保存在你的设备上。本网站使用 Google Analytics 了解访问情况，详见隐私政策。
    - q: 投屏到电视需要什么条件？
      a: 电视需要支持 DLNA 接收（DMR），并与设备连接同一网络。iPhone / iPad 上的自动发现需要 Apple 的多播网络权限，目前仍在申请中；Mac 不受此限制。
    - q: 支持 Apple TV 吗？
      a: Apple TV 版本已在规划中。目前支持 iPhone、iPad 和 Mac，你也可以通过投屏在客厅电视上观看。

