  faq_title: 常见问题
  faq:
  - q: 都播网页版免费吗？需要注册吗？
    a: 完全免费，也不需要注册账号。打开页面、添加播放列表就能看。
  - q: 支持哪些播放列表格式？
    a: 支持 M3U 和 M3U8 播放列表，包括带 tvg-id、tvg-logo、group-title 等扩展信息的 IPTV 列表；直播流支持 HLS（.m3u8）。
  - q: 我的播放列表保存在哪里？
