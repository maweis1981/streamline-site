features:
  eyebrow: Fitur
  title: Mulus dari impor sampai menonton
  subtitle: Dibuat secara native, sehingga ringan, mulus, dan hemat baterai.
  items:
  - icon: import
    title: Impor playlist M3U apa pun
    desc: Tambahkan URL atau file .m3u / .m3u8 lokal. Nama saluran, grup, dan logo diurai secara otomatis, dan 20 playlist terakhir diingat serta dipulihkan saat aplikasi dibuka.
  - icon: grid
    title: Grup, pencarian, dan favorit
    desc: Jelajahi per group-title, cari nama saluran dan grup secara instan, tandai saluran favorit, dan kembali ke saluran yang baru ditonton.
  - icon: pulse
    title: Periksa semua saluran sekaligus
    desc: Doubo menguji seluruh playlist secara paralel dan menyusun saluran yang siap diputar, jadi Anda tinggal tekan putar.
  - icon: route
    title: Ganti jalur dengan sekali ketuk
    desc: Jika satu saluran punya beberapa sumber, ganti di antaranya pada bagian Jalur dan pilih yang paling lancar kapan saja.
  - icon: pip
    title: Pengalaman pemutaran native
    desc: Dibangun di atas AVKit, dengan Picture in Picture, trek subtitle, kecepatan putar, dan layar penuh lanskap. Baris saluran yang sedang diputar menampilkan cuplikan langsung.
  - icon: cast
    title: Kirim ke TV Anda
    desc: Kirim ke smart TV DLNA di jaringan yang sama, atau buka file video lokal untuk diputar langsung.
  - icon: lock
    title: Privasi yang utama
    desc: Playlist, favorit, dan riwayat tetap di perangkat Anda. Aplikasi ini tidak memiliki SDK iklan atau analitik dan tidak mengumpulkan data pribadi apa pun.
