    a: Tidak. Alat ini hanya membaca teks playlist untuk menghitung dan merapikannya, tanpa membuka stream apa pun. Untuk menonton, gunakan pemutar web atau aplikasi Doubo.
  - q: Seberapa besar playlist yang didukung?
    a: Playlist dengan puluhan ribu entri diproses dalam hitungan detik, tergantung perangkat Anda.
  - q: Apakah playlist saya disimpan?
    a: Tidak. Semuanya diproses di memori browser dan terhapus saat halaman ditutup.
