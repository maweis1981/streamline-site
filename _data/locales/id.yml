faq:
  title: Pertanyaan umum
  items:
  - q: Apakah Doubo menyediakan saluran TV?
    a: Tidak. Doubo adalah pemutar; aplikasi ini tidak menyertakan atau menjual konten saluran. Tambahkan playlist yang berhak Anda gunakan. Daftar rekomendasi di aplikasi adalah tautan publik pihak ketiga, dan ketersediaan serta hak tontonnya ditentukan oleh penyedianya.
  - q: Bagaimana cara memulai?
    a: Ketuk Tambah, tempel URL playlist M3U / M3U8 yang berhak Anda gunakan, atau impor file .m3u / .m3u8 dari aplikasi File. Saluran akan dikelompokkan secara otomatis. Lihat halaman Panduan untuk langkah lengkapnya.
  - q: Format apa saja yang didukung?
    a: Playlist M3U dan M3U8, dengan siaran langsung seperti HLS (.m3u8) yang didukung pemutar bawaan Apple. Anda juga bisa membuka file video lokal secara langsung.
  - q: Apakah data saya dikumpulkan?
    a: Aplikasi ini tidak mengumpulkan data pribadi. Playlist, favorit, dan riwayat tontonan tetap di perangkat Anda. Situs web ini menggunakan Google Analytics untuk memahami kunjungan; lihat kebijakan privasi.
  - q: Apa yang dibutuhkan untuk mengirim ke TV?
    a: TV harus mendukung DLNA renderer (DMR) dan berada di jaringan yang sama. Penemuan otomatis di iPhone dan iPad memerlukan izin jaringan multicast dari Apple, yang masih dalam proses; Mac tidak terpengaruh.
  - q: Apakah ada versi Android?
    a: Sedang dalam perjalanan. Doubo untuk Android akan mendukung ponsel, tablet, dan Android TV / TV box, dan kami akan mengumumkannya di sini begitu tersedia.
  - q: Apakah bisa digunakan di Apple TV?
    a: Versi Apple TV sedang direncanakan. Saat ini Doubo berjalan di iPhone, iPad, dan Mac, dan Anda bisa mengirim siaran ke TV di ruang keluarga.
