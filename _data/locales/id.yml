guide:
  title: Panduan
  subtitle: 'Mulai dalam tiga menit: putar playlist M3U / M3U8 di iPhone, iPad, dan Mac.'
  description: 'Cara menggunakan Doubo: tambahkan playlist M3U / M3U8 di iPhone, iPad, dan Mac, jelajahi saluran, tonton dengan Picture in Picture, dan kirim ke TV.'
  intro: Sebelum memulai, siapkan URL atau file playlist M3U / M3U8 yang berhak Anda gunakan. Doubo adalah pemutar dan tidak menyediakan saluran apa pun.
  steps:
  - title: Tambahkan playlist
    desc: Buka Doubo dan ketuk Tambah. Pilih “Tambah URL playlist” untuk menempel alamat M3U, atau “Impor file playlist” untuk mengimpor file .m3u / .m3u8 dari aplikasi File.
  - title: Jelajahi, cari, dan simpan favorit
    desc: Saluran dikelompokkan berdasarkan group-title secara otomatis. Cari nama saluran atau grup di bagian atas, tandai saluran yang sering ditonton, dan temukan saluran yang baru diputar kapan saja.
  - title: Rapikan saluran dengan sekali ketuk
    desc: Ketuk “Periksa saluran” dan Doubo akan menguji seluruh playlist secara paralel, sehingga Anda bisa menampilkan hanya saluran yang siap diputar.
  - title: Putar dan Picture in Picture
    desc: Ketuk saluran untuk memutar. Nikmati Picture in Picture, trek subtitle, kecepatan putar, dan layar penuh lanskap, serta tetap menonton saat memakai aplikasi lain.
  - title: Kirim ke TV Anda
    desc: Ketuk ikon transmisi di pemutar dan pilih smart TV DLNA di jaringan yang sama untuk menonton di layar besar.
  - title: Kelola beberapa playlist
    desc: 20 playlist terakhir disimpan di perangkat Anda. Doubo membuka kembali playlist yang terakhir ditonton, dan Anda bisa beralih kapan saja.
  tips_title: Tips
  tips:
  - Playlist harus berformat M3U atau M3U8; alamat saluran biasanya diawali http(s)://.
  - Jika satu saluran punya beberapa sumber, ganti di antaranya pada bagian Jalur.
  - Playlist, favorit, dan riwayat tetap di perangkat Anda, dan bisa dihapus kapan saja di Pengaturan.
  cta: Masih ada pertanyaan? Lihat pertanyaan umum atau hubungi kami
