features:
  eyebrow: ฟีเจอร์
  title: ลื่นไหลตั้งแต่นำเข้าจนถึงรับชม
  subtitle: พัฒนาแบบเนทีฟ จึงเบา ลื่นไหล และประหยัดแบตเตอรี่
  items:
  - icon: import
    title: นำเข้าเพลย์ลิสต์ M3U ได้ทุกแบบ
    desc: เพิ่ม URL หรือไฟล์ .m3u / .m3u8 ในเครื่อง ระบบแยกชื่อช่อง กลุ่ม และโลโก้ให้อัตโนมัติ และจำเพลย์ลิสต์ 20 รายการล่าสุดไว้เปิดต่อเมื่อเข้าแอปครั้งถัดไป
  - icon: grid
    title: กลุ่ม การค้นหา และรายการโปรด
    desc: เรียกดูตาม group-title ค้นหาชื่อช่องและกลุ่มได้ทันที ติดดาวช่องที่ดูประจำ และกลับไปยังช่องที่ดูล่าสุด
  - icon: pulse
    title: ตรวจทุกช่องในครั้งเดียว
    desc: Doubo ตรวจทั้งเพลย์ลิสต์พร้อมกัน แล้วจัดเรียงช่องที่พร้อมเล่นไว้ให้ แค่กดดูได้ทันที
  - icon: route
    title: สลับสัญญาณได้ในแตะเดียว
    desc: เมื่อช่องเดียวกันมีหลายแหล่ง สลับระหว่างกันได้ในส่วนสัญญาณ และเลือกแหล่งที่ลื่นที่สุดได้ทุกเมื่อ
  - icon: pip
    title: ประสบการณ์การเล่นแบบเนทีฟ
    desc: สร้างบน AVKit รองรับภาพซ้อนภาพ เลือกคำบรรยาย ปรับความเร็ว และเต็มจอเมื่อหมุนแนวนอน แถวของช่องที่กำลังเล่นแสดงภาพสด
  - icon: cast
    title: ส่งขึ้นทีวี
    desc: ส่งไปยังสมาร์ททีวีที่รองรับ DLNA ในเครือข่ายเดียวกัน หรือเปิดไฟล์วิดีโอในเครื่องเพื่อเล่นได้ทันที
  - icon: lock
    title: ความเป็นส่วนตัวมาก่อน
    desc: เพลย์ลิสต์ รายการโปรด และประวัติอยู่บนอุปกรณ์ของคุณ แอปไม่มี SDK โฆษณาหรือวิเคราะห์ และไม่เก็บข้อมูลส่วนบุคคลใดๆ
