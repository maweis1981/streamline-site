  features:
  - t: ไม่ต้องติดตั้ง
    d: ใช้ได้กับ Chrome, Edge, Safari, Firefox และเบราว์เซอร์รุ่นใหม่อื่น ๆ
  - t: กลุ่มและการค้นหา
    d: อ่านกลุ่มในเพลย์ลิสต์ให้ คุณจึงหาช่องได้เร็วแม้มีหลายพันช่อง
  - t: สลับเส้นทางอัตโนมัติ
    d: ช่องที่มีหลายลิงก์จะถูกรวมไว้ และเครื่องเล่นจะเปลี่ยนไปลิงก์ถัดไปเองเมื่อลิงก์หนึ่งเริ่มเล่นไม่ได้
  - t: ให้ความสำคัญกับความเป็นส่วนตัว
    d: เพลย์ลิสต์อยู่ในเบราว์เซอร์ของคุณเท่านั้น ไม่มีการอัปโหลดหรือเก็บข้อมูล
  faq_title: คำถามที่พบบ่อย
  faq:
  - q: เครื่องเล่นบนเว็บฟรีไหม ต้องมีบัญชีหรือเปล่า
    a: ฟรีทั้งหมดและไม่ต้องมีบัญชี เปิดหน้าเว็บ เพิ่มเพลย์ลิสต์ แล้วเริ่มดูได้เลย
  - q: รองรับเพลย์ลิสต์รูปแบบไหน
    a: รองรับเพลย์ลิสต์ M3U และ M3U8 รวมถึงรายการ IPTV ที่มีแอตทริบิวต์ tvg-id, tvg-logo และ group-title สตรีมสดเล่นผ่าน HLS (.m3u8)
  - q: เพลย์ลิสต์ของฉันเก็บไว้ที่ไหน
    a: เก็บไว้ในพื้นที่จัดเก็บของเบราว์เซอร์ที่คุณใช้อยู่เท่านั้น และไม่ถูกอัปโหลด หากเปลี่ยนเบราว์เซอร์หรือล้างข้อมูลเว็บไซต์ ให้เพิ่มใหม่อีกครั้ง
  - q: ทำไมบางช่องแนะนำให้ดูในแอป
    a: ด้วยเหตุผลด้านความปลอดภัย เบราว์เซอร์จำกัดสตรีมสดบางรายการ เช่น ลิงก์ http หรือเส้นทางที่ต้องใช้ส่วนหัวพิเศษ แอป Doubo ไม่มีข้อจำกัดนี้ และยังรองรับการแคสต์ขึ้นทีวีและการเล่นเบื้องหลัง
