faq:
  title: คำถามที่พบบ่อย
  items:
  - q: Doubo มีช่องทีวีให้ไหม
    a: ไม่มี Doubo เป็นแอปเล่นเท่านั้น ไม่ได้รวมหรือขายเนื้อหาช่องใดๆ กรุณาเพิ่มเพลย์ลิสต์ที่คุณมีสิทธิ์ใช้งาน รายการแนะนำในแอปเป็นลิงก์สาธารณะของบุคคลที่สาม ความพร้อมใช้งานและสิทธิ์การรับชมขึ้นอยู่กับผู้ให้บริการนั้นๆ
  - q: เริ่มใช้งานอย่างไร
    a: แตะ เพิ่ม แล้ววาง URL เพลย์ลิสต์ M3U / M3U8 ที่คุณมีสิทธิ์ใช้งาน หรือนำเข้าไฟล์ .m3u / .m3u8 จากแอปไฟล์ ช่องต่างๆ จะถูกจัดกลุ่มให้อัตโนมัติ ดูขั้นตอนทั้งหมดได้ที่หน้าคู่มือ
  - q: รองรับรูปแบบไฟล์อะไรบ้าง
    a: รองรับเพลย์ลิสต์ M3U และ M3U8 และเล่นสตรีมสด เช่น HLS (.m3u8) ที่เครื่องเล่นของ Apple รองรับ นอกจากนี้ยังเปิดไฟล์วิดีโอในเครื่องได้โดยตรง
  - q: แอปเก็บข้อมูลของฉันไหม
    a: แอปไม่เก็บข้อมูลส่วนบุคคล เพลย์ลิสต์ รายการโปรด และประวัติการรับชมอยู่บนอุปกรณ์ของคุณ เว็บไซต์นี้ใช้ Google Analytics เพื่อทำความเข้าใจการเข้าชม ดูรายละเอียดในนโยบายความเป็นส่วนตัว
  - q: ต้องใช้อะไรบ้างในการส่งขึ้นทีวี
    a: ทีวีต้องรองรับการแสดงผล DLNA (DMR) และอยู่ในเครือข่ายเดียวกัน การค้นหาอุปกรณ์อัตโนมัติบน iPhone และ iPad ต้องได้รับสิทธิ์เครือข่าย multicast จาก Apple ซึ่งยังอยู่ระหว่างดำเนินการ ส่วน Mac ไม่ได้รับผลกระทบ
  - q: มีเวอร์ชัน Android ไหม
    a: กำลังจะมา Doubo สำหรับ Android จะรองรับโทรศัพท์ แท็บเล็ต และ Android TV / กล่องทีวี และเราจะประกาศที่นี่ทันทีที่พร้อมใช้งาน
  - q: ใช้บน Apple TV ได้ไหม
    a: เวอร์ชัน Apple TV อยู่ในแผนพัฒนา ตอนนี้ Doubo ใช้ได้บน iPhone, iPad และ Mac และคุณสามารถส่งภาพขึ้นทีวีในห้องนั่งเล่นได้
