  - title: เพิ่มเพลย์ลิสต์
    desc: เปิด Doubo แล้วแตะ เพิ่ม เลือก “เพิ่ม URL เพลย์ลิสต์” เพื่อวางที่อยู่ M3U หรือ “นำเข้าไฟล์เพลย์ลิสต์” เพื่อนำเข้าไฟล์ .m3u / .m3u8 จากแอปไฟล์
  - title: เรียกดู ค้นหา และเพิ่มรายการโปรด
    desc: ช่องจะถูกจัดกลุ่มตาม group-title ให้อัตโนมัติ ค้นหาชื่อช่องหรือกลุ่มได้ที่ด้านบน ติดดาวช่องที่ดูบ่อย และกลับไปยังช่องที่ดูล่าสุดได้ทุกเมื่อ
  - title: จัดระเบียบช่องในแตะเดียว
    desc: แตะ “ตรวจสอบช่อง” แล้ว Doubo จะตรวจทั้งเพลย์ลิสต์พร้อมกัน เพื่อให้คุณแสดงเฉพาะช่องที่พร้อมเล่น
  - title: เล่นและภาพซ้อนภาพ
    desc: แตะช่องเพื่อเล่น รองรับภาพซ้อนภาพ คำบรรยาย ความเร็วการเล่น และเต็มจอแนวนอน ดูต่อได้แม้ขณะใช้แอปอื่น
  - title: ส่งขึ้นทีวี
    desc: แตะไอคอนส่งภาพในเครื่องเล่น แล้วเลือกสมาร์ททีวีที่รองรับ DLNA ในเครือข่ายเดียวกันเพื่อดูบนจอใหญ่
  - title: จัดการหลายเพลย์ลิสต์
    desc: เพลย์ลิสต์ 20 รายการล่าสุดถูกบันทึกไว้ในเครื่อง Doubo จะเปิดรายการที่คุณดูล่าสุดให้อัตโนมัติ และสลับได้ทุกเมื่อ
  tips_title: เคล็ดลับ
  tips:
  - เพลย์ลิสต์ต้องเป็นรูปแบบ M3U หรือ M3U8 โดยที่อยู่ช่องมักขึ้นต้นด้วย http(s)://
  - เมื่อช่องเดียวกันมีหลายแหล่ง สลับได้ในส่วนสัญญาณ
  - เพลย์ลิสต์ รายการโปรด และประวัติอยู่บนอุปกรณ์ของคุณ และลบได้ทุกเมื่อในการตั้งค่า
  cta: มีคำถามเพิ่มเติม ดูคำถามที่พบบ่อยหรือติดต่อเรา
