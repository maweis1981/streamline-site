  opt_merge: Gabungkan laluan saluran yang sama (semua laluan disimpan)
  download: Muat turun M3U yang dikemas
  open_web: Buka dalam pemain web
  privacy: Semuanya berjalan dalam pelayar anda. Fail anda tidak pernah dimuat naik.
  seo_title: Apa yang alat ini lakukan
  seo_points:
  - Mengira entri, saluran dan kumpulan, serta berapa entri yang ada logo atau tvg-id.
  - Mencari pautan strim yang sama sekali pendua dan membuangnya dengan satu klik.
  - Menyusun mengikut kumpulan dan nama saluran, lalu mengeksport fail M3U yang kemas.
  - Menyimpan pautan HTTPS sahaja, yang boleh dimainkan dalam lebih banyak pelayar dan peranti.
  faq:
  - q: Adakah alat ini menyemak sama ada pautan boleh dimainkan?
    a: Tidak. Ia hanya membaca teks senarai main untuk mengira dan mengemasnya, dan tidak membuka sebarang strim. Untuk menonton, gunakan pemain web atau aplikasi Doubo.
  - q: Sebesar mana senarai main yang disokong?
    a: Senarai main dengan puluhan ribu entri diproses dalam beberapa saat, bergantung pada peranti anda.
  - q: Adakah senarai main saya disimpan?
    a: Tidak. Semuanya diproses dalam memori pelayar dan dipadam apabila anda menutup halaman.
