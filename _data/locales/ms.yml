faq:
  title: Soalan lazim
  items:
  - q: Adakah Doubo menyediakan saluran TV?
    a: Tidak. Doubo ialah pemain; ia tidak membekalkan atau menjual kandungan saluran. Tambah senarai main yang anda dibenarkan gunakan. Senarai yang disyorkan dalam aplikasi ialah pautan awam pihak ketiga, dan ketersediaan serta hak tontonan ditentukan oleh penyedianya.
  - q: Bagaimana cara bermula?
    a: Ketik Tambah, tampal URL senarai main M3U / M3U8 yang anda dibenarkan gunakan, atau import fail .m3u / .m3u8 daripada Fail. Saluran akan dikumpulkan secara automatik. Lihat halaman Panduan untuk langkah demi langkah.
  - q: Format apa yang disokong?
    a: Senarai main M3U dan M3U8, dengan strim langsung seperti HLS (.m3u8) yang disokong oleh pemain asli Apple. Anda juga boleh membuka fail video tempatan secara terus.
  - q: Adakah data saya dikumpul?
    a: Aplikasi ini tidak mengumpul data peribadi. Senarai main, kegemaran dan sejarah tontonan kekal pada peranti anda. Laman web ini menggunakan Google Analytics untuk memahami lawatan; lihat dasar privasi.
  - q: Apa yang diperlukan untuk menghantar ke TV?
    a: TV mesti menyokong pemaparan DLNA (DMR) dan berada dalam rangkaian yang sama. Penemuan automatik pada iPhone dan iPad memerlukan kebenaran rangkaian multicast Apple, yang masih dalam proses; Mac tidak terjejas.
  - q: Adakah versi Android?
    a: Ia sedang dalam perjalanan. Doubo untuk Android akan menyokong telefon, tablet dan Android TV / kotak TV, dan kami akan mengumumkannya di sini sebaik sahaja tersedia.
  - q: Adakah ia berfungsi di Apple TV?
    a: Versi Apple TV sedang dirancang. Buat masa ini Doubo berfungsi di iPhone, iPad dan Mac, dan anda boleh menghantar ke TV di ruang tamu.
