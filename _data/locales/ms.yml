guide:
  title: Panduan
  subtitle: 'Mula dalam tiga minit: mainkan senarai main M3U / M3U8 di iPhone, iPad dan Mac.'
  description: 'Cara menggunakan Doubo: tambah senarai main M3U / M3U8 di iPhone, iPad dan Mac, layari saluran, tonton dalam Gambar dalam Gambar dan hantar ke TV.'
  intro: Sebelum bermula, sediakan URL atau fail senarai main M3U / M3U8 yang anda dibenarkan gunakan. Doubo ialah pemain dan tidak menyediakan sebarang saluran.
  steps:
  - title: Tambah senarai main
    desc: Buka Doubo dan ketik Tambah. Pilih “Tambah URL senarai main” untuk menampal alamat M3U, atau “Import fail senarai main” untuk mengimport fail .m3u / .m3u8 daripada aplikasi Fail.
  - title: Layari, cari dan simpan kegemaran
    desc: Saluran dikumpulkan mengikut group-title secara automatik. Cari nama saluran atau kumpulan di bahagian atas, tandakan saluran kegemaran dan cari saluran yang baru ditonton bila-bila masa.
  - title: Susun saluran dengan sekali ketik
    desc: Ketik “Semak saluran” dan Doubo akan menguji seluruh senarai main secara serentak, supaya anda boleh paparkan hanya saluran yang sedia dimainkan.
  - title: Main dan Gambar dalam Gambar
    desc: Ketik saluran untuk main. Nikmati Gambar dalam Gambar, trek sari kata, kelajuan main balik dan skrin penuh landskap, serta terus menonton semasa menggunakan aplikasi lain.
  - title: Hantar ke TV anda
    desc: Ketik ikon hantar dalam pemain dan pilih TV pintar DLNA dalam rangkaian yang sama untuk menonton di skrin besar.
  - title: Urus beberapa senarai main
    desc: 20 senarai main terakhir disimpan pada peranti anda. Doubo membuka semula senarai yang terakhir ditonton, dan anda boleh menukarnya bila-bila masa.
  tips_title: Petua
  tips:
  - Senarai main mesti dalam format M3U atau M3U8; alamat saluran biasanya bermula dengan http(s)://.
  - Jika satu saluran mempunyai beberapa sumber, tukar antaranya di bahagian Talian.
  - Senarai main, kegemaran dan sejarah kekal pada peranti anda, dan boleh dipadam bila-bila masa dalam Tetapan.
