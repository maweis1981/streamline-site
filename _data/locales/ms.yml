features:
  eyebrow: Ciri
  title: Lancar dari import hingga menonton
  subtitle: Dibina secara asli, jadi ia ringan, lancar dan jimat bateri.
  items:
  - icon: import
    title: Import mana-mana senarai main M3U
    desc: Tambah URL atau fail .m3u / .m3u8 tempatan. Nama saluran, kumpulan dan logo dihuraikan secara automatik, dan 20 senarai main terakhir diingati serta dipulihkan semasa aplikasi dibuka.
  - icon: grid
    title: Kumpulan, carian dan kegemaran
    desc: Layari mengikut group-title, cari nama saluran dan kumpulan serta-merta, tandakan saluran kegemaran dan kembali ke saluran yang baru ditonton.
  - icon: pulse
    title: Semak semua saluran sekaligus
    desc: Doubo menguji seluruh senarai main secara serentak dan menyusun saluran yang sedia dimainkan, jadi anda hanya perlu tekan main.
  - icon: route
    title: Tukar talian dengan sekali ketik
    desc: Jika satu saluran mempunyai beberapa sumber, tukar antaranya di bahagian Talian dan pilih yang paling lancar pada bila-bila masa.
  - icon: pip
    title: Pengalaman main balik asli
    desc: Dibina atas AVKit, dengan Gambar dalam Gambar, trek sari kata, kelajuan main balik dan skrin penuh landskap. Baris saluran yang sedang dimainkan memaparkan bingkai langsung.
  - icon: cast
    title: Hantar ke TV anda
    desc: Hantar ke TV pintar DLNA dalam rangkaian yang sama, atau buka fail video tempatan untuk dimainkan terus.
  - icon: lock
    title: Privasi diutamakan
    desc: Senarai main, kegemaran dan sejarah kekal pada peranti anda. Aplikasi ini tiada SDK iklan atau analitik dan tidak mengumpul sebarang data peribadi.
