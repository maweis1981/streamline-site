au:
  dtt: ABC、SBS、Seven、Nine 和 Ten 的免费电视节目通过 DVB-T 免费播出，收看需要天线以及数字电视机或机顶盒；Freeview 列出 30 多个频道，包括数字子频道。经 Freeview 认证且接入宽带的电视机还可使用在线节目指南和回看应用。
  services:
  - 免费收看 ABC 直播频道和点播节目，无广告；点播节目需注册免费的 ABC 账户。
  - 免费直播 SBS、SBS VICELAND、SBS Food、SBS World Movies 和 NITV，并提供点播节目；需注册经验证的免费账户。
  - 免费直播 7、7TWO、7mate、7Bravo 和 7flix，并提供体育、综艺节目和电影点播。
  - 免费直播 Channel 9、9Go!、9Gem、9Life 和 9Rush，并提供回看；需注册免费账户。
  notes:
  - 澳大利亚广播机构应用中的直播仅限在澳大利亚境内观看。
  - ABC 直播频道可在 iview 网站上免登录观看；SBS On Demand 的直播按新南威尔士州的节目时间表播出。
cn:
  dtt: 免费数字地面电视采用国家 DTMB 标准（GB 20600）；观众需要配备 DTMB 调谐器的电视机或机顶盒以及地面天线，接收效果取决于与发射台的距离。收看免费，国家基本公共服务标准要求通过无线方式提供不少于 15 套频道，主要为 CCTV 以及省级和地方频道。
  services:
  - 中央广播电视总台官方视频应用，免费直播 CCTV 各频道和各省级卫视，并提供点播节目；部分功能和内容需要登录账户或在应用内购买。
  - 免费直播全部 CCTV 频道以及众多省级卫视和城市频道，支持时移和回看；部分点播内容需开通付费会员。
  - 在浏览器中直播 CCTV-1、CCTV-13 等 CCTV 频道，并提供节目表和点播片段。
  - 提供湖南卫视 24 小时直播和免费点播节目，开通 VIP 会员可观看更多内容。
  notes:
  - 国家基本公共服务标准（2021 年版和 2023 年版）要求通过无线方式免费提供不少于 15 套电视频道，在直播卫星覆盖地区通过直播卫星提供不少于 25 套。
  - 主管部门于 2017 年表示，尚未批准任何加密付费数字地面电视业务。
hk:
  dtt: 数字地面电视基于国家 DTMB 标准（GB 20600），自 2020 年 11 月 30 日模拟电视关闭以来已成为唯一的广播方式。观众需要数字电视机或机顶盒以及天线，收看无线电视、ViuTV、HOY 和香港电台的免费频道（约 14 个频道）无需缴纳订阅费。
  services:
  - 这家公共广播机构的免费应用提供港台电视 31 至 35 台的网络直播，并提供视频点播和下载。
  - 无线电视的平台将翡翠台、TVB Plus 和无线新闻台列为免费直播频道，另有付费套餐；该服务仅限在香港和澳门使用。
  - 免费直播 ViuTV（99 台），ViuTVsix（96 台）因版权原因仅在有限时段直播；仅限香港。
  - 免费 24 小时直播 HOY 76、77 和 78 台，并提供点播节目；免费直播仅限在香港观看。
  notes:
  - 政府表示，接收免费数字地面电视无需缴纳订阅费。
  - 大多数广播机构的直播仅限香港境内观众观看。
id:
  dtt: 收看免费数字电视需要天线和配备 DVB-T2 调谐器的电视机，旧式模拟电视机则需加装 DVB-T2 机顶盒；收看免费。模拟信号已于 2022 年至 2023 年间分地区关闭，政府向低收入家庭免费发放机顶盒。
  services:
  - 免费直播这家公共广播机构的全国频道（包括 TVRI Nasional 和 TVRI Sport）和地方台，并提供点播重播。
  - 免费直播 RCTI、MNCTV、GTV 和 iNews，含广告，并可回看近期节目。
  - SCTV、Indosiar 等免费频道可免费在线直播，含广告；高级频道、许多体育赛事和无广告观看需购买付费套餐。
  notes:
  - 许多非官方的“在线电视”应用未获授权；广播机构自己的应用和网站才是合法渠道。
in:
  dtt: Doordarshan 运营免费 DVB-T2 数字地面电视服务，但仅覆盖有限的城市（Prasar Bharati 列出 19 个），收看需要 DVB-T2 机顶盒或配备 DVB-T2 调谐器的电视机以及天线。印度大部分免费电视收看通过 Prasar Bharati 的免费卫星服务 DD Free Dish 实现，一次性购买卫星天线和机顶盒（约 1,500 至 2,000 卢比）后无月费或年费，提供 160 多个电视频道。
  services:
  - 公共广播机构应用，提供约 140 个电视直播频道（包括全部 Doordarshan 卫星频道），以及广播和点播内容；几乎所有内容免费，少数为付费内容。
  - 免费的含广告服务，提供印度原创剧集、电影和节目，也可通过亚马逊购物应用和 Prime Video 访问。
  - 免费的含广告直播频道（三星称有 150 多个），涵盖新闻、电影、音乐和娱乐，仅限三星设备使用。
  notes:
  - DD Free Dish 终身免费，无需订阅；Prasar Bharati 建议使用授权机顶盒，因为未授权机顶盒上的 MPEG-4 频道可能会受到限制。
  - DD Free Dish 的频道数量会在每年频道时段拍卖后发生变化；请查阅 Prasar Bharati 的最新列表。
jp:
  dtt: 地面数字电视采用 ISDB-T，使用 UHF 13 至 62 频道；观众需要支持地面数字广播的电视机或调谐器以及 UHF 天线。无需订阅费，可收看 NHK 综合频道、NHK 教育频道和当地商业电视台，频道数量因地区而异；拥有电视机的家庭须缴纳 NHK 收视费。
  services:
  - 免费提供商业电视台部分节目播出后限期回看，并直播五大商业电视网以黄金时段为主的节目；电视端应用不提供直播。
  - 约 25 至 30 个免费线性频道，包括一个 24 小时新闻频道，无需注册；ABEMA Premium（每月 1,080 日元，含广告版 580 日元）提供独家内容和更多功能。
  - NHK 的国际服务在全球免费直播其英语电视频道，部分节目可回看 7 天。
  notes:
  - NHK 自己的同步播出和回看服务 NHK ONE（自 2025 年 10 月 1 日起接替 NHK+）需要签订 NHK 收视合同；已缴纳收视费的家庭无需额外付费。
  - NHK 地面合同的收视费为每月 1,100 日元（冲绳为 965 日元），仅限网络的合同费用相同。
  - TVer 和 ABEMA 面向日本境内观众；TVer 的帮助页面说明其视频无法在海外观看。
kr:
  dtt: KBS、MBC、SBS 和 EBS 的地面频道可通过天线免费收看：高清采用 ATSC 1.0，4K UHD 采用 ATSC 3.0，后者需要配备 ATSC 3.0 调谐器的 UHD 电视机。许多公寓楼通过共用屋顶天线系统分配信号，较旧的系统可能无法传输 ATSC 3.0 信号。
  services:
  - 公共广播机构应用，提供 KBS 直播频道和点播重播；应用免费，部分重播需付费。
  - 免费直播 MBC、MBC every1、MBC DRAMA 等七个 MBC 频道；许多重播需购买付费通行证。
  - 登录会员可免费收看 SBS、SBS Plus、SBS Sports 和 SBS Golf 直播（非会员可预览 3 分钟），另有部分免费重播。
  - 免费直播 EBS1 等六个 EBS 频道；完整重播需付费。
  notes:
  - 在韩国境外，由于播出版权原因，KBS+ 仅提供部分直播频道。
  - 部分广播机构应用（例如 SBS play）需注册免费账户才能完整收看直播。
my:
  dtt: 免费数字电视通过 UHF 天线和内置 DVB-T2 调谐器的电视机或 DVB-T2 解码器接收，无需订阅费；MYTV 列出约 17 个电视频道以及数字广播。模拟电视已于 2019 年在全国关闭，沙巴和砂拉越是最后关闭的地区，时间为 2019 年 10 月 31 日。
  services:
  - 免费直播 TV1、TV2、TV Okey、Berita RTM、TV Sukan、TV6 和 RTM Parlimen 等 RTM 频道，并提供广播直播和近期节目回看。
  - 注册免费的含广告账户即可收看 TV3 等本地电视直播频道和点播节目；付费的 TontonUp 套餐提供高级内容。
  - 注册免费账户后，可以标清画质收看一组含广告频道（如 Astro Awani、Bernama TV 和 TV Sarawak）和精选节目；大多数体育和高级内容需购买付费套餐。
  notes:
  - RTMKlik 上的 RTM 频道直播仅限马来西亚境内观看。
  - Tonton 和 sooka 需注册免费账户才能收看其免费频道。
ph:
  dtt: 数字地面电视继续免费播出，通过天线和配备 ISDB-T 调谐器的电视机接收，旧式模拟电视机需加装数字电视盒。根据 NTC 通告，大马尼拉地区的模拟电视计划于 2026 年 11 月 22 日关闭；全国其他地区的关闭日期尚未确定。
  services:
  - 这家国营广播机构在其网站以及官方 YouTube 和 Dailymotion 频道上直播其频道。
  - 免费应用，提供 GMA 电视直播，以及菲律宾节目、亚洲剧集和电影点播。
  - GMA Network 的官方 YouTube 和 Facebook 页面免费同步播出 GMA 的午间和黄金时段节目；gmanetwork.com 上也可免费观看完整剧集。
  - ABS-CBN 的流媒体服务注册后可免费观看部分节目，并于 2026 年推出部分 Kapamilya 节目免费观看活动；大部分内容需要订阅。
  notes:
  - 大马尼拉地区关闭模拟信号后，只有模拟电视机的家庭需要数字电视盒；DICT 表示将为弱势家庭开展援助计划。
sg:
  dtt: 自 2019 年 1 月 1 日模拟电视停播以来，新传媒的免费频道以 DVB-T2 数字方式播出；观众需要内置 DVB-T2 调谐器的电视机或 DVB-T2 机顶盒，以及室内或屋顶 UHF 天线。接收免费，六个免费频道为 Channel 5、8频道、U频道、Suria、Vasantham 和亚洲新闻台。
  services:
  - 免费直播 Channel 5、8频道、U频道、Suria、Vasantham 和亚洲新闻台，并免费提供新传媒节目点播，另有付费 Prime 档位可无广告观看并收看合作方内容；直播频道仅限新加坡境内。
  - 免费的亚洲新闻台应用和亚洲新闻台官方 YouTube 频道提供 CNA 24/7 直播以及纪录片和时事节目点播，在新加坡境外也可使用。
  - 新传媒的免费华语新闻应用，提供时事节目和新闻简报点播。
  notes:
  - 新加坡自 2011 年 1 月 1 日起取消广播电视执照费，收看无需缴费。
  - mewatch 上的直播频道仅限新加坡境内观看；在海外只能观看部分节目。
  - 付费电视用户（StarHub、Singtel）已经以数字方式接收新传媒的免费频道。
th:
  dtt: 免费数字电视通过天线和内置 DVB-T2 调谐器的电视机或 DVB-T2 机顶盒接收，无需订阅费。模拟广播于 2020 年结束，Channel 3 于 2020 年 3 月 25 日成为最后一个停播的模拟频道；商业数字电视执照有效期至 2029 年。
  services:
  - 这家公共广播机构在其网站和应用上免费直播其频道，提供 AI 生成的实时字幕和点播节目。
  - Thai PBS 的点播平台免费提供剧集、纪录片和 Thai PBS 节目，无广告。
  - Channel 3 可免费直播和回看，含广告；付费的 3Plus Premium 档位去除广告并提供附加内容。
  - Thai PBS、Channel 3 和 Channel 7 等免费频道列在 TrueID 的免费频道中；TrueVisions 高级频道需购买付费套餐。
  notes:
  - Channel 7HD 已将其 BUGABOO.TV 和 CH7HD 应用合并为名为 CH7ON 的新应用。
tw:
  dtt: 免费数字地面电视采用 DVB-T，自 2012 年 6 月 30 日起已全面取代模拟电视；由于多个频道为高清，观众需要数字电视天线以及支持高清解码的电视机或机顶盒。收看免费，提供五家无线电视台（台视、中视、华视、民视和公视）约 20 个频道。
  services:
  - 这家公共广播机构的无广告平台免费直播公视、公视台语台、公视3台和公视新闻，点播剧集和纪录片大多免费；需注册账户，少数内容按次付费。
  - 公视官方 YouTube 频道 24 小时直播公视新闻，公视还列出其主频道和公视台语台的官方直播。
  - 来自台湾的免费英语新闻、纪录片和直播频道，无广告，全球可看。
  - 华视的免费新闻应用提供 24 小时新闻直播。
  notes:
  - 地面信号也通过卫星转播，作为地面接收不佳地区的免费替代方案。
  - 部分商业新闻频道已停止在台湾的 24 小时 YouTube 直播，因此 YouTube 上的可用情况可能变化。
uk:
  dtt: Freeview 无需订阅，需要屋顶或室内天线以及 Freeview 电视机或机顶盒；视所在地区而定，提供约 70 个电视频道，包括高清和流媒体频道在内则超过 100 个。高清频道采用 DVB-T2，因此仅支持 DVB-T 的旧接收设备只能收看标清频道。Freely 通过宽带提供主要直播频道，无需天线。
  services:
  - BBC 直播频道和 BBC 节目点播，无广告；使用需持有电视执照。
  - 免费的含广告 ITV 直播频道、主题流媒体频道和点播节目；ITVX Premium 去除大部分点播广告并附带 BritBox。
  - 免费直播 Channel 4、E4、More4、Film4 和 4seven，并提供点播节目和片库；需免费注册。
  - Channel 5 的流媒体服务（原 My5），提供其直播频道、免费流媒体频道和回看。
  - 内置于部分智能电视和设备中，通过宽带（建议 10Mbps）直播 BBC、ITV、Channel 4、Channel 5 等机构的 70 多个频道，无需天线。
  notes:
  - 在任何频道或服务上观看或录制电视直播（包括 Freeview、Freely 和应用内直播）以及使用 BBC iPlayer 的任何内容都需要电视执照；其他服务的点播内容则无需执照。
  - 根据 GOV.UK，电视执照费用为每年 £180；无执照观看电视直播最高可被罚款 £1,000。
  - BBC iPlayer 和英国广播机构应用中的直播面向英国观众；Channel 4 的 Watch Live 仅限英国居民使用。
us:
  dtt: 本地广播电视台（如 ABC、CBS、NBC、Fox、PBS 及其子频道）可通过天线和配备 ATSC 调谐器的电视机或转换器免费收看；频道数量取决于所在地点。ATSC 3.0（NEXTGEN TV）需要兼容的调谐器，电视台必须继续以 ATSC 1.0 播出，因此现有电视机仍可使用。
  services:
  - 免费直播所在地 PBS 电视台，并提供 PBS 节目点播。
  - 数百个免费的含广告直播频道，以及电影和节目点播；无需账户。
  - 大型免费点播片库以及 250 多个直播频道，包括 Fox 旗下电视台和其他集团的本地新闻。
  - 免费的含广告直播频道、电影、节目和 Roku Originals，可在网页、Roku 移动应用和 Roku 设备上观看。
  notes:
  - PBS 直播仅显示所在地理区域的电视台，在流媒体设备应用上需要账户。
  - 部分电视台对 ATSC 3.0 信号进行加密，可能导致一些 NEXTGEN TV 设备无法接收；FCC 正在对此进行审查。
vn:
  dtt: 数字地面电视免费播出，可通过天线和内置 DVB-T2 调谐器的电视机或 DVB-T2 机顶盒收看；据 VTV 介绍，全部 VTV 频道均以 DVB-T2 播出。模拟地面电视已于 2020 年 12 月 28 日在全国关闭。
  services:
  - 这家公共广播机构的国家级平台免费直播 VTV 频道、国家重要频道和省级频道，并提供往期节目重播；付费的 VTVgo Plus 档位去除弹出广告并提供附加内容。
  - 注册免费账户即可收看一组基本直播频道，包括 VTV1；标有 VIP 的频道需购买付费套餐。
  - 免费应用，提供 HTV 及其 HTVC 有线中心制作的直播频道，以及电影和节目点播。
  notes:
  - VTV1 被指定为国家重要频道，免费播出。
  - HTV Online 应用仅为越南境内用户提供服务。
  - 作为国家媒体机构重组的一部分，VTC 的频道已于 2025 年 1 月停播。
