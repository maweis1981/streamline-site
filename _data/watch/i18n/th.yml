au:
  dtt: ทีวีฟรีจาก ABC, SBS, Seven, Nine และ Ten ออกอากาศฟรีผ่านระบบ DVB-T โดยต้องใช้เสาอากาศและทีวีดิจิทัลหรือกล่องรับสัญญาณ Freeview ระบุว่ามีมากกว่า 30 ช่อง รวมถึงช่องย่อยดิจิทัล ทีวีที่ได้รับการรับรองจาก Freeview และเชื่อมต่ออินเทอร์เน็ตบรอดแบนด์จะมีผังรายการออนไลน์และแอปดูย้อนหลังเพิ่มเติมด้วย
  services:
  - ช่อง ABC สดฟรีและรายการออนดีมานด์โดยไม่มีโฆษณา ต้องมีบัญชี ABC Account (ฟรี) เพื่อดูรายการออนดีมานด์
  - สตรีมสดฟรีของ SBS, SBS VICELAND, SBS Food, SBS World Movies และ NITV พร้อมรายการออนดีมานด์ ต้องมีบัญชีฟรีที่ยืนยันตัวตนแล้ว
  - สตรีมสดฟรีของ 7, 7TWO, 7mate, 7Bravo และ 7flix พร้อมกีฬา รายการ และภาพยนตร์แบบออนดีมานด์
  - สตรีมสดฟรีของ Channel 9, 9Go!, 9Gem, 9Life และ 9Rush พร้อมการดูย้อนหลัง ต้องมีบัญชีฟรี
  notes:
  - สตรีมสดในแอปของผู้แพร่ภาพออสเตรเลียจำกัดการรับชมเฉพาะในออสเตรเลีย
  - ช่องสดของ ABC สามารถรับชมบนเว็บไซต์ iview ได้โดยไม่ต้องเข้าสู่ระบบ ส่วนสตรีมสดของ SBS On Demand เป็นไปตามผังรายการของรัฐนิวเซาท์เวลส์ (NSW)
cn:
  dtt: ทีวีดิจิทัลภาคพื้นดินแบบฟรีใช้มาตรฐาน DTMB ระดับชาติ (GB 20600) ผู้ชมต้องมีทีวีหรือกล่องรับสัญญาณที่มีจูนเนอร์ DTMB และเสาอากาศภาคพื้นดิน โดยคุณภาพการรับสัญญาณขึ้นอยู่กับระยะห่างจากสถานีส่ง รับชมได้ฟรี และมาตรฐานบริการสาธารณะระดับชาติกำหนดให้มีอย่างน้อย 15 ช่องทางภาคพื้นดิน ส่วนใหญ่เป็น CCTV รวมถึงช่องระดับมณฑลและท้องถิ่น
  services:
  - แอปวิดีโออย่างเป็นทางการของ CMG ที่มีสตรีมสดฟรีของช่อง CCTV และช่องดาวเทียมระดับมณฑล พร้อมรายการออนดีมานด์ บางฟีเจอร์และเนื้อหาต้องมีบัญชีหรือซื้อในแอป
  - สตรีมสดฟรีของทุกช่อง CCTV และช่องดาวเทียมระดับมณฑลและช่องระดับเมืองจำนวนมาก พร้อมการดูย้อนเวลาและดูย้อนหลัง เนื้อหาออนดีมานด์บางส่วนต้องเป็นสมาชิกแบบเสียเงิน
  - สตรีมสดผ่านเบราว์เซอร์ของช่อง CCTV เช่น CCTV-1 และ CCTV-13 พร้อมผังรายการและคลิปออนดีมานด์
  - มีสตรีมสด Hunan TV ตลอด 24 ชั่วโมงและรายการออนดีมานด์ฟรี ส่วนสมาชิก VIP จะปลดล็อกเนื้อหาเพิ่มเติม
  notes:
  - มาตรฐานบริการสาธารณะขั้นพื้นฐานระดับชาติ (ฉบับปี 2021 และ 2023) กำหนดให้มีช่องทีวีฟรีทางภาคพื้นดินอย่างน้อย 15 ช่อง หรืออย่างน้อย 25 ช่องผ่านดาวเทียมแบบส่งตรงในพื้นที่ที่บริการดาวเทียมครอบคลุม
  - หน่วยงานกำกับดูแลระบุในปี 2017 ว่ายังไม่มีการอนุมัติบริการทีวีดิจิทัลภาคพื้นดินแบบเสียเงินที่เข้ารหัส
hk:
  dtt: ทีวีดิจิทัลภาคพื้นดินใช้มาตรฐาน DTMB ระดับชาติ (GB 20600) และเป็นวิธีการออกอากาศเพียงวิธีเดียวนับตั้งแต่ปิดทีวีแอนะล็อกเมื่อวันที่ 30 พฤศจิกายน 2020 ผู้ชมต้องมีทีวีดิจิทัลหรือกล่องรับสัญญาณและเสาอากาศ และไม่ต้องจ่ายค่าสมาชิกสำหรับช่องฟรีจาก TVB, ViuTV, HOY และ RTHK (ประมาณ 14 ช่อง)
  services:
  - แอปฟรีของผู้แพร่ภาพสาธารณะให้บริการถ่ายทอดสดทางเว็บของ RTHK TV 31 ถึง 35 พร้อมวิดีโอออนดีมานด์และการดาวน์โหลด
  - แพลตฟอร์มของ TVB ระบุให้ Jade, TVB Plus และ TVB News อยู่ในกลุ่มช่องสดฟรี ควบคู่กับแพ็กเกจแบบเสียเงิน บริการนี้ใช้ได้เฉพาะในฮ่องกงและมาเก๊า
  - สตรีมสดฟรีของ ViuTV (ช่อง 99) ส่วน ViuTVsix (ช่อง 96) สตรีมเฉพาะบางช่วงเวลาเนื่องจากข้อจำกัดด้านลิขสิทธิ์ ใช้ได้เฉพาะในฮ่องกง
  - สตรีมสดฟรีตลอด 24 ชั่วโมงของช่อง HOY 76, 77 และ 78 พร้อมรายการออนดีมานด์ การสตรีมฟรีใช้ได้เฉพาะในฮ่องกง
  notes:
  - รัฐบาลระบุว่าไม่ต้องเสียค่าสมาชิกในการรับชมทีวีดิจิทัลภาคพื้นดินแบบฟรี
  - สตรีมสดของผู้แพร่ภาพส่วนใหญ่จำกัดเฉพาะผู้ชมในฮ่องกง
id:
  dtt: ทีวีดิจิทัลแบบฟรีต้องใช้เสาอากาศและทีวีที่มีจูนเนอร์ DVB-T2 หรือกล่องรับสัญญาณ DVB-T2 สำหรับทีวีแอนะล็อกรุ่นเก่า รับชมได้ฟรี การออกอากาศแอนะล็อกถูกปิดทีละภูมิภาคระหว่างปี 2022 ถึง 2023 และรัฐบาลได้แจกกล่องรับสัญญาณฟรีให้แก่ครัวเรือนรายได้น้อย
  services:
  - สตรีมสดฟรีของช่องระดับชาติของผู้แพร่ภาพสาธารณะ (รวมถึง TVRI Nasional และ TVRI Sport) และสถานีระดับภูมิภาค พร้อมการดูซ้ำแบบออนดีมานด์
  - สตรีมสดฟรีแบบมีโฆษณาของ RCTI, MNCTV, GTV และ iNews พร้อมการดูย้อนหลังรายการล่าสุด
  - ช่องฟรีทีวี เช่น SCTV และ Indosiar สามารถสตรีมสดได้ฟรีแบบมีโฆษณา ส่วนช่องพรีเมียม การแข่งขันกีฬาหลายรายการ และการรับชมแบบไม่มีโฆษณาต้องใช้แพ็กเกจแบบเสียเงิน
  notes:
  - แอป "TV online" ที่ไม่เป็นทางการจำนวนมากไม่ได้รับอนุญาต แอปและเว็บไซต์ของผู้แพร่ภาพเองจึงเป็นทางเลือกที่ถูกกฎหมาย
in:
  dtt: Doordarshan ให้บริการทีวีดิจิทัลภาคพื้นดินแบบฟรีระบบ DVB-T2 แต่มีเฉพาะในเมืองจำนวนจำกัด (Prasar Bharati ระบุ 19 เมือง) และต้องใช้กล่องรับสัญญาณ DVB-T2 หรือทีวีที่มีจูนเนอร์ DVB-T2 พร้อมเสาอากาศ การรับชมทีวีฟรีส่วนใหญ่ในอินเดียเป็นผ่าน DD Free Dish ซึ่งเป็นบริการดาวเทียมฟรีของ Prasar Bharati ไม่มีค่าบริการรายเดือนหรือรายปีหลังจากซื้อจานดาวเทียมและกล่องรับสัญญาณครั้งเดียว (ประมาณ Rs 1,500 ถึง 2,000) และมีช่องทีวีมากกว่า 160 ช่อง
  services:
  - แอปของผู้แพร่ภาพสาธารณะที่มีช่องทีวีสดประมาณ 140 ช่อง รวมถึงช่องดาวเทียมทั้งหมดของ Doordarshan พร้อมวิทยุและรายการออนดีมานด์ เนื้อหาเกือบทั้งหมดฟรี มีเพียงบางรายการที่เป็นพรีเมียม
  - บริการฟรีแบบมีโฆษณาที่มีซีรีส์ออริจินัล ภาพยนตร์ และรายการของอินเดีย เข้าถึงได้ผ่านแอปช้อปปิ้ง Amazon และ Prime Video ด้วย
  - ช่องสดฟรีแบบมีโฆษณา (Samsung ระบุมากกว่า 150 ช่อง) ทั้งข่าว ภาพยนตร์ เพลง และบันเทิง ใช้ได้เฉพาะบนอุปกรณ์ Samsung
  notes:
  - DD Free Dish ใช้ได้ฟรีตลอดชีพโดยไม่ต้องสมัครสมาชิก Prasar Bharati แนะนำให้ใช้กล่องรับสัญญาณที่ได้รับอนุญาต เนื่องจากอาจจำกัดช่อง MPEG-4 บนกล่องที่ไม่ได้รับอนุญาต
  - จำนวนช่องของ DD Free Dish เปลี่ยนแปลงหลังการประมูลช่องประจำปีแต่ละครั้ง โปรดตรวจสอบรายการปัจจุบันของ Prasar Bharati
jp:
  dtt: ทีวีดิจิทัลภาคพื้นดินใช้ระบบ ISDB-T บนช่อง UHF 13 ถึง 62 ผู้ชมต้องมีทีวีหรือจูนเนอร์สำหรับการออกอากาศดิจิทัลภาคพื้นดินและเสาอากาศ UHF ไม่มีค่าสมาชิก และผู้ชมจะได้รับ NHK General TV, NHK Educational TV และสถานีเชิงพาณิชย์ท้องถิ่น โดยจำนวนช่องแตกต่างกันไปตามภูมิภาค ครัวเรือนที่มีทีวีต้องชำระค่าธรรมเนียมการรับชม NHK
  services:
  - ดูย้อนหลังฟรีสำหรับรายการที่คัดเลือกจากผู้แพร่ภาพเชิงพาณิชย์ในระยะเวลาจำกัดหลังออกอากาศ พร้อมสตรีมสดของเครือข่ายเชิงพาณิชย์ทั้งห้าโดยเน้นช่วงไพรม์ไทม์ สตรีมสดไม่มีให้บริการในแอปบนทีวี
  - ช่องเชิงเส้นฟรีประมาณ 25 ถึง 30 ช่อง รวมถึงช่องข่าว 24 ชั่วโมง โดยไม่ต้องลงทะเบียน ABEMA Premium (1,080 เยนต่อเดือน หรือ 580 เยนแบบมีโฆษณา) เพิ่มเนื้อหาและฟีเจอร์พิเศษ
  - บริการระหว่างประเทศของ NHK สตรีมสดช่องทีวีภาษาอังกฤษฟรีทั่วโลก พร้อมการดูย้อนหลัง 7 วันสำหรับรายการที่คัดเลือก
  notes:
  - บริการออกอากาศคู่ขนานและดูย้อนหลังของ NHK เองคือ NHK ONE (ต่อจาก NHK+ ตั้งแต่วันที่ 1 ตุลาคม 2025) ต้องมีสัญญาการรับชม NHK ครัวเรือนที่ชำระค่าธรรมเนียมอยู่แล้วไม่ต้องจ่ายเพิ่ม
  - ค่าธรรมเนียมการรับชม NHK สำหรับสัญญาภาคพื้นดินคือ 1,100 เยนต่อเดือน (965 เยนในโอกินาวา) และสัญญาเฉพาะอินเทอร์เน็ตมีราคาเท่ากัน
  - TVer และ ABEMA ออกแบบมาสำหรับผู้ชมในญี่ปุ่น หน้าช่วยเหลือของ TVer ระบุว่าไม่สามารถรับชมวิดีโอจากต่างประเทศได้
kr:
  dtt: ช่องภาคพื้นดินของ KBS, MBC, SBS และ EBS รับชมได้ฟรีทางอากาศด้วยเสาอากาศ โดยเป็น HD ในระบบ ATSC 1.0 และ 4K UHD ในระบบ ATSC 3.0 ซึ่งต้องใช้ทีวี UHD ที่มีจูนเนอร์ ATSC 3.0 อาคารอพาร์ตเมนต์จำนวนมากกระจายสัญญาณผ่านระบบเสาอากาศรวมบนหลังคา และระบบรุ่นเก่าอาจไม่ส่งผ่านสัญญาณ ATSC 3.0
  services:
  - แอปของผู้แพร่ภาพสาธารณะที่มีช่องสดของ KBS และการดูซ้ำแบบออนดีมานด์ แอปใช้ได้ฟรี และการดูซ้ำบางรายการต้องเสียเงิน
  - สตรีมสดฟรีของเจ็ดช่อง MBC รวมถึง MBC, MBC every1 และ MBC DRAMA การดูซ้ำหลายรายการต้องใช้บัตรผ่านแบบเสียเงิน
  - SBS, SBS Plus, SBS Sports และ SBS Golf สดฟรีสำหรับสมาชิกที่เข้าสู่ระบบ (ผู้ที่ไม่ใช่สมาชิกดูตัวอย่างได้ 3 นาที) พร้อมการดูซ้ำฟรีบางรายการ
  - สตรีมสดฟรีของหกช่อง EBS รวมถึง EBS1 การเข้าถึงการดูซ้ำแบบเต็มต้องเสียเงิน
  notes:
  - นอกเกาหลี KBS+ แสดงเพียงบางช่องสดเนื่องจากข้อจำกัดด้านลิขสิทธิ์การออกอากาศ
  - แอปของผู้แพร่ภาพบางรายต้องมีบัญชีฟรีเพื่อรับชมสดได้เต็มรูปแบบ (เช่น SBS play)
my:
  dtt: ทีวีดิจิทัลแบบฟรีรับชมได้ด้วยเสาอากาศ UHF และทีวีที่มีจูนเนอร์ DVB-T2 ในตัวหรือกล่องถอดรหัส DVB-T2 โดยไม่มีค่าสมาชิก MYTV ระบุว่ามีช่องทีวีประมาณ 17 ช่องพร้อมวิทยุดิจิทัล ทีวีแอนะล็อกถูกปิดทั่วประเทศในปี 2019 โดยซาบาห์และซาราวักเป็นภูมิภาคสุดท้ายเมื่อวันที่ 31 ตุลาคม 2019
  services:
  - สตรีมสดฟรีของช่อง RTM รวมถึง TV1, TV2, TV Okey, Berita RTM, TV Sukan, TV6 และ RTM Parlimen พร้อมวิทยุสดและการดูย้อนหลังรายการล่าสุด
  - บัญชีฟรีแบบมีโฆษณาให้เข้าถึงช่องทีวีสดในประเทศ เช่น TV3 และรายการออนดีมานด์ แพ็กเกจ TontonUp แบบเสียเงินเพิ่มเนื้อหาพรีเมียม
  - หลังจากลงทะเบียนบัญชีฟรี ผู้ชมสามารถรับชมกลุ่มช่องแบบมีโฆษณา (เช่น Astro Awani, Bernama TV และ TV Sarawak) และรายการที่คัดเลือกในความละเอียดมาตรฐาน กีฬาส่วนใหญ่และเนื้อหาพรีเมียมต้องใช้แพ็กเกจแบบเสียเงิน
  notes:
  - การสตรีมสดช่องของ RTM บน RTMKlik ใช้ได้เฉพาะในมาเลเซีย
  - Tonton และ sooka ต้องมีบัญชีฟรีเพื่อรับชมช่องฟรี
ph:
  dtt: ทีวีดิจิทัลภาคพื้นดินยังคงเป็นฟรีทีวี และรับชมได้ด้วยเสาอากาศและทีวีที่มีจูนเนอร์ ISDB-T หรือกล่องทีวีดิจิทัลสำหรับทีวีแอนะล็อกรุ่นเก่า ทีวีแอนะล็อกในเมกะมะนิลามีกำหนดปิดในวันที่ 22 พฤศจิกายน 2026 ตามหนังสือเวียนของ NTC ส่วนวันที่สำหรับพื้นที่อื่นของประเทศยังไม่ได้กำหนด
  services:
  - ผู้แพร่ภาพของรัฐสตรีมสดช่องของตนบนเว็บไซต์ และบนช่อง YouTube และ Dailymotion อย่างเป็นทางการด้วย
  - แอปฟรีที่รวมโทรทัศน์ GMA สดเข้ากับรายการฟิลิปปินส์ ละครเอเชีย และภาพยนตร์แบบออนดีมานด์
  - ออกอากาศคู่ขนานฟรีของรายการช่วงบ่ายและไพรม์ไทม์ของ GMA บนหน้า YouTube และ Facebook อย่างเป็นทางการของ GMA Network ตอนเต็มยังรับชมได้ฟรีบน gmanetwork.com
  - บริการสตรีมมิงของ ABS-CBN ให้รับชมบางรายการฟรีเมื่อลงทะเบียน และในปี 2026 ได้โปรโมตการรับชมฟรีสำหรับรายการ Kapamilya ที่คัดเลือก แคตตาล็อกส่วนใหญ่ต้องสมัครสมาชิก
  notes:
  - หลังการปิดสัญญาณในเมกะมะนิลา ครัวเรือนที่มีเพียงทีวีแอนะล็อกต้องใช้กล่องทีวีดิจิทัล DICT ระบุว่าจะดำเนินโครงการช่วยเหลือสำหรับครัวเรือนกลุ่มเปราะบาง
sg:
  dtt: ช่องฟรีทีวีของ Mediacorp ออกอากาศแบบดิจิทัลในระบบ DVB-T2 นับตั้งแต่ทีวีแอนะล็อกยุติลงเมื่อวันที่ 1 มกราคม 2019 ผู้ชมต้องมีทีวีที่มีจูนเนอร์ DVB-T2 ในตัวหรือกล่องรับสัญญาณ DVB-T2 พร้อมเสาอากาศ UHF แบบในอาคารหรือบนหลังคา การรับชมไม่มีค่าใช้จ่าย และช่องฟรีทีวีทั้งหกคือ Channel 5, Channel 8, Channel U, Suria, Vasantham และ CNA
  services:
  - สตรีมสดฟรีของ Channel 5, Channel 8, Channel U, Suria, Vasantham และ CNA พร้อมรายการ Mediacorp แบบออนดีมานด์ฟรี และมีระดับ Prime แบบเสียเงินสำหรับการรับชมแบบไม่มีโฆษณาและเนื้อหาจากพันธมิตร ช่องสดใช้ได้เฉพาะในสิงคโปร์
  - แอป CNA ฟรีและช่อง YouTube อย่างเป็นทางการของ CNA มีไลฟ์สตรีม CNA 24/7 พร้อมสารคดีและรายการข่าวสารปัจจุบันแบบออนดีมานด์ และใช้งานได้นอกสิงคโปร์
  - แอปข่าวภาษาจีนฟรีของ Mediacorp พร้อมรายการข่าวสารปัจจุบันและข่าวประจำวันแบบออนดีมานด์
  notes:
  - สิงคโปร์ยกเลิกค่าธรรมเนียมใบอนุญาตวิทยุและโทรทัศน์ตั้งแต่วันที่ 1 มกราคม 2011 จึงไม่ต้องเสียค่าธรรมเนียมในการรับชม
  - ช่องสดบน mewatch จำกัดการรับชมเฉพาะในสิงคโปร์ มีเพียงรายการที่คัดเลือกเท่านั้นที่รับชมได้จากต่างประเทศ
  - ผู้สมัครสมาชิกเพย์ทีวี (StarHub, Singtel) ได้รับช่องฟรีทีวีของ Mediacorp ในระบบดิจิทัลอยู่แล้ว
th:
  dtt: ทีวีดิจิทัลแบบฟรีรับชมได้ด้วยเสาอากาศและทีวีที่มีจูนเนอร์ DVB-T2 ในตัวหรือกล่องรับสัญญาณ DVB-T2 โดยไม่มีค่าสมาชิก การออกอากาศแอนะล็อกสิ้นสุดลงในปี 2020 เมื่อช่อง 3 เป็นช่องแอนะล็อกช่องสุดท้ายที่ยุติการออกอากาศในวันที่ 25 มีนาคม 2020 ใบอนุญาตทีวีดิจิทัลเชิงพาณิชย์มีอายุถึงปี 2029
  services:
  - ผู้แพร่ภาพสาธารณะสตรีมสดช่องของตนฟรีบนเว็บไซต์และแอป พร้อมคำบรรยายสดที่สร้างด้วย AI และรายการออนดีมานด์
  - แพลตฟอร์มออนดีมานด์ของ Thai PBS ให้รับชมละคร สารคดี และรายการของ Thai PBS ฟรีโดยไม่มีโฆษณา
  - ช่อง 3 รับชมสดและดูย้อนหลังได้ฟรีแบบมีโฆษณา ระดับ 3Plus Premium แบบเสียเงินจะไม่มีโฆษณาและเพิ่มสิทธิพิเศษ
  - ช่องฟรีทีวี เช่น Thai PBS, ช่อง 3 และช่อง 7 อยู่ในรายการช่องฟรีของ TrueID ส่วนช่องพรีเมียมของ TrueVisions ต้องใช้แพ็กเกจแบบเสียเงิน
  notes:
  - ช่อง 7HD ได้รวมแอป BUGABOO.TV และ CH7HD เข้าเป็นแอปใหม่ชื่อ CH7ON
tw:
  dtt: ทีวีดิจิทัลภาคพื้นดินแบบฟรีใช้ระบบ DVB-T และแทนที่ระบบแอนะล็อกทั้งหมดตั้งแต่วันที่ 30 มิถุนายน 2012 ผู้ชมต้องมีเสาอากาศทีวีดิจิทัลและทีวีหรือกล่องรับสัญญาณที่ถอดรหัส HD ได้ เนื่องจากหลายช่องออกอากาศแบบ HD รับชมได้ฟรีและมีประมาณ 20 ช่องจากผู้แพร่ภาพภาคพื้นดินทั้งห้าราย (TTV, CTV, CTS, FTV และ PTS)
  services:
  - แพลตฟอร์มไม่มีโฆษณาของผู้แพร่ภาพสาธารณะมีสตรีมสดฟรีของ PTS, PTS Taigi, PTS XS และ PTS News และละครกับสารคดีแบบออนดีมานด์ที่ส่วนใหญ่ฟรี ต้องมีบัญชี และบางรายการเป็นแบบจ่ายต่อครั้ง
  - ช่อง YouTube อย่างเป็นทางการของ PTS สตรีม PTS News ตลอด 24 ชั่วโมง และ PTS ยังระบุสตรีมสดอย่างเป็นทางการของช่องหลักและ PTS Taigi ด้วย
  - ข่าว สารคดี และช่องสดภาษาอังกฤษจากไต้หวันแบบฟรี ไม่มีโฆษณา และรับชมได้ทั่วโลก
  - แอปข่าวฟรีของ CTS มีสตรีมข่าวสดตลอด 24 ชั่วโมง
  notes:
  - สัญญาณภาคพื้นดินยังถูกถ่ายทอดผ่านดาวเทียมเป็นทางเลือกฟรีสำหรับพื้นที่ที่รับสัญญาณภาคพื้นดินได้ไม่ดี
  - ช่องข่าวเชิงพาณิชย์บางช่องได้หยุดไลฟ์สตรีม 24 ชั่วโมงบน YouTube ในไต้หวัน ดังนั้นการรับชมบน YouTube อาจเปลี่ยนแปลงได้
uk:
  dtt: Freeview ไม่มีค่าสมาชิก และต้องใช้เสาอากาศบนหลังคาหรือในอาคารพร้อมทีวีหรือกล่อง Freeview มีช่องทีวีประมาณ 70 ช่อง หรือมากกว่า 100 ช่องหากรวมช่อง HD และช่องสตรีมมิง ขึ้นอยู่กับพื้นที่ของคุณ ช่อง HD ใช้ระบบ DVB-T2 เครื่องรับรุ่นเก่าที่รองรับเฉพาะ DVB-T จึงรับได้เพียงช่องความละเอียดมาตรฐาน Freely ส่งช่องสดหลักผ่านบรอดแบนด์โดยไม่ต้องใช้เสาอากาศ
  services:
  - ช่อง BBC สดและรายการ BBC แบบออนดีมานด์โดยไม่มีโฆษณา ต้องมีใบอนุญาตทีวี (TV licence) จึงจะใช้งานได้
  - ช่อง ITV สดฟรีแบบมีโฆษณา ช่องสตรีมมิงตามธีม และรายการออนดีมานด์ ITVX Premium ตัดโฆษณาออนดีมานด์ส่วนใหญ่และเพิ่ม BritBox
  - Channel 4, E4, More4, Film4 และ 4seven สดฟรี พร้อมรายการออนดีมานด์และคลังรายการ ต้องลงทะเบียนฟรี
  - บริการสตรีมมิงของ Channel 5 (เดิมชื่อ My5) พร้อมช่องสด ช่องสตรีมมิงฟรี และการดูย้อนหลัง
  - มีอยู่ในสมาร์ททีวีและอุปกรณ์บางรุ่น สตรีมช่องสดมากกว่า 70 ช่องจาก BBC, ITV, Channel 4, Channel 5 และอื่น ๆ ผ่านบรอดแบนด์ (แนะนำ 10Mbps) โดยไม่ต้องใช้เสาอากาศ
  notes:
  - ต้องมีใบอนุญาตทีวีเพื่อดูหรือบันทึกทีวีสดในทุกช่องหรือบริการ (รวมถึง Freeview, Freely และสตรีมสดในแอป) และเพื่อใช้ BBC iPlayer ในทุกกรณี เนื้อหาออนดีมานด์จากบริการอื่นไม่ต้องใช้ใบอนุญาต
  - ใบอนุญาตทีวีมีราคา £180 ต่อปีตามข้อมูลของ GOV.UK การดูทีวีสดโดยไม่มีใบอนุญาตอาจถูกปรับสูงสุด £1,000
  - BBC iPlayer และสตรีมสดในแอปของผู้แพร่ภาพสหราชอาณาจักรมีไว้สำหรับผู้ชมในสหราชอาณาจักร Watch Live ของ Channel 4 จำกัดเฉพาะผู้พำนักในสหราชอาณาจักร
us:
  dtt: สถานีโทรทัศน์ท้องถิ่น (เช่น ABC, CBS, NBC, Fox, PBS และช่องย่อย) รับชมได้ฟรีทางอากาศด้วยเสาอากาศและทีวีหรือตัวแปลงสัญญาณที่มีจูนเนอร์ ATSC จำนวนช่องขึ้นอยู่กับสถานที่ ATSC 3.0 (NEXTGEN TV) ต้องใช้จูนเนอร์ที่รองรับ และสถานีต้องออกอากาศในระบบ ATSC 1.0 ต่อไป ทีวีที่มีอยู่จึงยังใช้งานได้
  services:
  - ไลฟ์สตรีมฟรีของสถานี PBS ท้องถิ่นของคุณ พร้อมรายการ PBS แบบออนดีมานด์
  - ช่องสดฟรีแบบมีโฆษณาหลายร้อยช่อง พร้อมภาพยนตร์และรายการแบบออนดีมานด์ ไม่ต้องมีบัญชี
  - คลังออนดีมานด์ฟรีขนาดใหญ่พร้อมช่องสดมากกว่า 250 ช่อง รวมถึงข่าวท้องถิ่นจากสถานี Fox และกลุ่มอื่น ๆ
  - ช่องสด ภาพยนตร์ รายการ และ Roku Originals ฟรีแบบมีโฆษณา รับชมได้บนเว็บและแอป Roku บนมือถือ รวมถึงอุปกรณ์ Roku
  notes:
  - ไลฟ์สตรีมของ PBS แสดงเฉพาะสถานีในพื้นที่ทางภูมิศาสตร์ของคุณ และแอปบนอุปกรณ์สตรีมมิงต้องมีบัญชี
  - บางสถานีเข้ารหัสสัญญาณ ATSC 3.0 ซึ่งอาจทำให้อุปกรณ์ NEXTGEN TV บางรุ่นรับสัญญาณไม่ได้ FCC กำลังพิจารณาเรื่องนี้
vn:
  dtt: ทีวีดิจิทัลภาคพื้นดินออกอากาศฟรีและรับชมได้ด้วยเสาอากาศและทีวีที่มีจูนเนอร์ DVB-T2 ในตัวหรือกล่องรับสัญญาณ DVB-T2 ตามข้อมูลของ VTV แพ็กเกจช่อง VTV ทั้งหมดออกอากาศผ่าน DVB-T2 ทีวีภาคพื้นดินแอนะล็อกถูกปิดทั่วประเทศเมื่อวันที่ 28 ธันวาคม 2020
  services:
  - แพลตฟอร์มระดับชาติของผู้แพร่ภาพสาธารณะสตรีมสดช่อง VTV ช่องสำคัญระดับชาติ และช่องระดับจังหวัดฟรี พร้อมการดูซ้ำรายการที่ผ่านมา ระดับ VTVgo Plus แบบเสียเงินจะไม่มีโฆษณาแบบป๊อปอัปและเพิ่มสิทธิพิเศษ
  - บัญชีที่ลงทะเบียนฟรีจะปลดล็อกกลุ่มช่องสดพื้นฐาน รวมถึง VTV1 ส่วนช่องที่ระบุว่า VIP ต้องใช้แพ็กเกจแบบเสียเงิน
  - แอปฟรีสำหรับช่องสดที่ผลิตโดย HTV และศูนย์เคเบิล HTVC พร้อมภาพยนตร์และรายการแบบออนดีมานด์
  notes:
  - VTV1 ได้รับการกำหนดให้เป็นช่องสำคัญระดับชาติและออกอากาศฟรี
  - แอป HTV Online ให้บริการเฉพาะผู้ใช้ในเวียดนาม
  - ช่องของ VTC ยุติการออกอากาศในเดือนมกราคม 2025 ซึ่งเป็นส่วนหนึ่งของการปรับโครงสร้างสื่อของรัฐ
