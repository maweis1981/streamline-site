au:
  dtt: TV percuma udara daripada ABC, SBS, Seven, Nine dan Ten disiarkan secara percuma melalui DVB-T dan memerlukan antena serta TV digital atau kotak penyahkod; Freeview menyenaraikan lebih 30 saluran, termasuk subsaluran digital. TV yang diperakui Freeview dengan jalur lebar juga menambah panduan dalam talian dan aplikasi tonton semula.
  services:
  - Saluran langsung ABC dan program atas permintaan secara percuma tanpa iklan; Akaun ABC percuma diperlukan untuk program atas permintaan.
  - Strim langsung percuma SBS, SBS VICELAND, SBS Food, SBS World Movies dan NITV serta program atas permintaan; akaun percuma yang disahkan diperlukan.
  - Strim langsung percuma 7, 7TWO, 7mate, 7Bravo dan 7flix serta sukan, rancangan dan filem atas permintaan.
  - Strim langsung percuma Channel 9, 9Go!, 9Gem, 9Life dan 9Rush serta tonton semula; akaun percuma diperlukan.
  notes:
  - Strim langsung dalam aplikasi penyiar Australia dihadkan secara geografi kepada Australia.
  - Saluran langsung ABC boleh ditonton di laman web iview tanpa log masuk; strim langsung SBS On Demand mengikut jadual NSW.
cn:
  dtt: TV terestrial digital percuma udara menggunakan piawaian nasional DTMB (GB 20600); penonton memerlukan TV atau kotak penyahkod dengan penala DTMB dan antena terestrial, dan penerimaan bergantung pada jarak ke pemancar. Ia percuma, dan piawaian perkhidmatan awam nasional menetapkan sekurang-kurangnya 15 saluran melalui udara, terutamanya CCTV serta saluran wilayah dan tempatan.
  services:
  - Aplikasi video rasmi CMG dengan strim langsung percuma saluran CCTV dan saluran satelit wilayah serta program atas permintaan; sesetengah ciri dan kandungan memerlukan akaun atau pembelian dalam aplikasi.
  - Strim langsung percuma semua saluran CCTV dan banyak saluran satelit wilayah serta saluran bandar, dengan anjakan masa dan tonton semula; sesetengah kandungan atas permintaan memerlukan keahlian berbayar.
  - Strim langsung berasaskan pelayar bagi saluran CCTV seperti CCTV-1 dan CCTV-13, dengan jadual program dan klip atas permintaan.
  - Menawarkan strim langsung 24 jam Hunan TV dan rancangan atas permintaan percuma, manakala keahlian VIP membuka lebih banyak kandungan.
  notes:
  - Piawaian perkhidmatan awam asas nasional (edisi 2021 dan 2023) menetapkan sekurang-kurangnya 15 saluran TV percuma melalui udara, atau sekurang-kurangnya 25 melalui satelit siaran terus di kawasan yang diliputi perkhidmatan satelit.
  - Pihak pengawal selia menyatakan pada 2017 bahawa tiada perkhidmatan TV terestrial digital berbayar yang disulitkan telah diluluskan.
hk:
  dtt: TV terestrial digital berasaskan piawaian nasional DTMB (GB 20600) dan telah menjadi satu-satunya kaedah siaran sejak TV analog dihentikan pada 30 November 2020. Penonton memerlukan TV digital atau kotak penyahkod dan antena, dan tidak membayar yuran langganan untuk saluran percuma daripada TVB, ViuTV, HOY dan RTHK (sekitar 14 saluran).
  services:
  - Aplikasi percuma penyiar awam menyediakan siaran web langsung RTHK TV 31 hingga 35, dengan video atas permintaan dan muat turun.
  - Platform TVB menandakan Jade, TVB Plus dan TVB News antara saluran langsung percumanya bersama pakej berbayar; perkhidmatan ini hanya untuk kegunaan di Hong Kong dan Macau.
  - Strim langsung percuma ViuTV (sal. 99), dengan ViuTVsix (sal. 96) distrim hanya pada waktu terhad atas sebab hak siaran; Hong Kong sahaja.
  - Strim langsung 24 jam percuma saluran HOY 76, 77 dan 78 serta program atas permintaan; penstriman percuma hanya berfungsi di Hong Kong.
  notes:
  - Kerajaan menyatakan bahawa tiada yuran langganan diperlukan untuk menerima TV terestrial digital percuma.
  - Kebanyakan strim langsung penyiar dihadkan kepada penonton di Hong Kong.
id:
  dtt: TV digital percuma udara memerlukan antena dan TV dengan penala DVB-T2, atau kotak penyahkod DVB-T2 untuk TV analog yang lebih lama; tontonan adalah percuma. Siaran analog dihentikan mengikut wilayah antara 2022 dan 2023, dan kerajaan mengedarkan kotak penyahkod percuma kepada isi rumah berpendapatan rendah.
  services:
  - Strim langsung percuma saluran nasional penyiar awam (termasuk TVRI Nasional dan TVRI Sport) dan stesen serantau, serta ulang tayang atas permintaan.
  - Strim langsung percuma disokong iklan bagi RCTI, MNCTV, GTV dan iNews, dengan tonton semula program terkini.
  - Saluran percuma udara seperti SCTV dan Indosiar boleh distrim secara langsung dan percuma dengan iklan; saluran premium, banyak perlawanan sukan dan tontonan tanpa iklan memerlukan pelan berbayar.
  notes:
  - Banyak aplikasi "TV online" tidak rasmi tidak berlesen; aplikasi dan laman web milik penyiar sendiri ialah pilihan yang sah.
in:
  dtt: Doordarshan mengendalikan perkhidmatan terestrial digital DVB-T2 percuma udara, tetapi hanya di sebilangan bandar yang terhad (Prasar Bharati menyenaraikan 19), dan ia memerlukan kotak penyahkod DVB-T2 atau TV dengan penala DVB-T2 serta antena. Kebanyakan tontonan TV percuma di India adalah melalui DD Free Dish, perkhidmatan satelit percuma Prasar Bharati, yang tidak mengenakan yuran bulanan atau tahunan selepas pembelian sekali sahaja piring dan kotak penyahkod (kira-kira Rs 1,500 hingga 2,000) dan membawa lebih 160 saluran TV.
  services:
  - Aplikasi penyiar awam dengan kira-kira 140 saluran TV langsung, termasuk semua saluran satelit Doordarshan, serta radio dan tajuk atas permintaan; hampir semua kandungan adalah percuma, dengan beberapa item premium.
  - Perkhidmatan percuma disokong iklan dengan siri asli, filem dan rancangan India, juga boleh dicapai melalui aplikasi beli-belah Amazon dan Prime Video.
  - Saluran langsung percuma disokong iklan (Samsung menyebut lebih 150) dalam kategori berita, filem, muzik dan hiburan, hanya tersedia pada peranti Samsung.
  notes:
  - DD Free Dish percuma seumur hidup tanpa langganan; Prasar Bharati mengesyorkan kotak penyahkod yang dibenarkan kerana ia mungkin menyekat saluran MPEG-4 pada kotak yang tidak dibenarkan.
  - Bilangan saluran DD Free Dish berubah selepas setiap lelongan slot tahunan; semak senarai semasa Prasar Bharati.
jp:
  dtt: TV digital terestrial menggunakan ISDB-T pada saluran UHF 13 hingga 62; penonton memerlukan TV atau penala untuk siaran digital terestrial dan antena UHF. Tiada caj langganan, dan penonton mendapat NHK General TV, NHK Educational TV dan stesen komersial tempatan, dengan bilangan saluran berbeza mengikut wilayah; isi rumah yang mempunyai TV mesti membayar yuran penerimaan NHK.
  services:
  - Tonton semula percuma program terpilih daripada penyiar komersial untuk tempoh terhad selepas disiarkan, serta strim langsung lima rangkaian komersial yang tertumpu pada waktu perdana; strim langsung tidak tersedia dalam aplikasi TV.
  - Kira-kira 25 hingga 30 saluran linear percuma, termasuk saluran berita 24 jam, tanpa perlu mendaftar; ABEMA Premium (1,080 yen sebulan, atau 580 yen dengan iklan) menambah kandungan dan ciri eksklusif.
  - Perkhidmatan antarabangsa NHK menstrim saluran TV berbahasa Inggerisnya secara langsung ke seluruh dunia secara percuma, dengan tonton semula 7 hari untuk program terpilih.
  notes:
  - Perkhidmatan siaran serentak dan tonton semula NHK sendiri, NHK ONE (pengganti NHK+ sejak 1 Oktober 2025), memerlukan kontrak penerimaan NHK; isi rumah yang sudah membayar yuran tidak perlu membayar apa-apa tambahan.
  - Yuran penerimaan NHK untuk kontrak terestrial ialah 1,100 yen sebulan (965 yen di Okinawa), dan kontrak internet sahaja berharga sama.
  - TVer dan ABEMA direka untuk penonton di Jepun; halaman bantuan TVer menyatakan bahawa videonya tidak boleh ditonton dari luar negara.
kr:
  dtt: 'Saluran terestrial KBS, MBC, SBS dan EBS adalah percuma melalui udara dengan antena, iaitu HD dalam ATSC 1.0 dan 4K UHD dalam ATSC 3.0, yang memerlukan TV UHD dengan penala ATSC 3.0. Banyak bangunan pangsapuri mengagihkan isyarat melalui sistem antena bumbung bersama, dan sistem yang lebih lama mungkin tidak dapat menyalurkan isyarat ATSC 3.0.'
  services:
  - Aplikasi penyiar awam dengan saluran langsung KBS dan ulang tayang atas permintaan; aplikasi ini percuma, dan sesetengah ulang tayang berbayar.
  - Strim langsung percuma tujuh saluran MBC termasuk MBC, MBC every1 dan MBC DRAMA; banyak ulang tayang memerlukan pas berbayar.
  - SBS, SBS Plus, SBS Sports dan SBS Golf secara langsung dan percuma untuk ahli yang log masuk (bukan ahli mendapat pratonton 3 minit), serta sesetengah ulang tayang percuma.
  - Strim langsung percuma enam saluran EBS termasuk EBS1; akses penuh kepada ulang tayang adalah berbayar.
  notes:
  - Di luar Korea, KBS+ hanya menayangkan sesetengah saluran langsung atas sebab hak siaran.
  - Akaun percuma diperlukan untuk tontonan langsung penuh pada sesetengah aplikasi penyiar (contohnya SBS play).
my:
  dtt: TV digital percuma udara diterima dengan antena UHF dan TV dengan penala DVB-T2 terbina dalam atau penyahkod DVB-T2, tanpa yuran langganan; MYTV menyenaraikan kira-kira 17 saluran TV serta radio digital. TV analog dihentikan di seluruh negara pada 2019, dengan Sabah dan Sarawak sebagai wilayah terakhir pada 31 Oktober 2019.
  services:
  - Strim langsung percuma saluran RTM termasuk TV1, TV2, TV Okey, Berita RTM, TV Sukan, TV6 dan RTM Parlimen, serta radio langsung dan tonton semula program terkini.
  - Akaun percuma disokong iklan memberikan akses kepada saluran TV langsung tempatan seperti TV3 dan rancangan atas permintaan; pelan berbayar TontonUp menambah kandungan premium.
  - Selepas mendaftar akaun percuma, penonton boleh menonton beberapa saluran disokong iklan (seperti Astro Awani, Bernama TV dan TV Sarawak) dan rancangan terpilih dalam definisi standard; kebanyakan sukan dan kandungan premium memerlukan pelan berbayar.
  notes:
  - Penstriman langsung saluran RTM di RTMKlik hanya tersedia di Malaysia.
  - Tonton dan sooka memerlukan akaun percuma untuk menonton saluran percuma mereka.
ph:
  dtt: TV terestrial digital kekal percuma udara dan diterima dengan antena dan TV dengan penala ISDB-T atau kotak TV digital untuk set analog yang lebih lama. TV analog di Mega Manila dijadualkan dihentikan pada 22 November 2026 di bawah pekeliling NTC; tarikh bagi bahagian lain negara belum ditetapkan.
  services:
  - Penyiar negara menstrim salurannya secara langsung di laman webnya, serta di saluran YouTube dan Dailymotion rasminya.
  - Aplikasi percuma yang menggabungkan televisyen GMA secara langsung dengan rancangan Filipina, drama Asia dan filem atas permintaan.
  - Siaran serentak percuma program petang dan waktu perdana GMA di halaman YouTube dan Facebook rasmi GMA Network; episod penuh juga percuma di gmanetwork.com.
  - Perkhidmatan penstriman ABS-CBN menawarkan sesetengah rancangan secara percuma dengan pendaftaran, dan pada 2026 mempromosikan tontonan percuma program Kapamilya terpilih; kebanyakan katalog memerlukan langganan.
  notes:
  - Selepas penghentian di Mega Manila, isi rumah yang hanya mempunyai TV analog memerlukan kotak TV digital; DICT menyatakan akan menjalankan program bantuan untuk isi rumah yang terdedah.
sg:
  dtt: Saluran percuma udara Mediacorp telah disiarkan secara digital dalam DVB-T2 sejak TV analog berakhir pada 1 Januari 2019; penonton memerlukan TV dengan penala DVB-T2 terbina dalam atau kotak penyahkod DVB-T2, serta antena UHF dalam rumah atau di bumbung. Penerimaan adalah percuma, dan enam saluran percuma udara ialah Channel 5, Channel 8, Channel U, Suria, Vasantham dan CNA.
  services:
  - Strim langsung percuma Channel 5, Channel 8, Channel U, Suria, Vasantham dan CNA serta program Mediacorp atas permintaan secara percuma, dengan peringkat Prime berbayar untuk tontonan tanpa iklan dan kandungan rakan kongsi; saluran langsung hanya berfungsi di Singapura.
  - Aplikasi CNA percuma dan saluran YouTube rasmi CNA menyiarkan strim langsung CNA 24/7 serta dokumentari dan rancangan hal ehwal semasa atas permintaan, dan tersedia di luar Singapura.
  - Aplikasi berita berbahasa Cina percuma Mediacorp, dengan program hal ehwal semasa dan buletin berita atas permintaan.
  notes:
  - Singapura memansuhkan yuran lesen radio dan TV mulai 1 Januari 2011, jadi tiada yuran diperlukan untuk menonton.
  - Saluran langsung di mewatch dihadkan secara geografi kepada Singapura; hanya program terpilih boleh ditonton di luar negara.
  - Pelanggan TV berbayar (StarHub, Singtel) sudah menerima saluran percuma udara Mediacorp secara digital.
th:
  dtt: TV digital percuma udara diterima dengan antena dan TV dengan penala DVB-T2 terbina dalam atau kotak penyahkod DVB-T2, tanpa yuran langganan. Siaran analog berakhir pada 2020, apabila Channel 3 menjadi saluran analog terakhir yang berhenti bersiaran pada 25 Mac 2020; lesen TV digital komersial berkuat kuasa sehingga 2029.
  services:
  - Penyiar awam menstrim salurannya secara langsung dan percuma di laman web dan aplikasinya, dengan sari kata langsung yang dijana AI dan program atas permintaan.
  - Platform atas permintaan Thai PBS menawarkan drama, dokumentari dan program Thai PBS secara percuma tanpa iklan.
  - Channel 3 boleh ditonton secara langsung dan tonton semula secara percuma dengan iklan; peringkat berbayar 3Plus Premium membuang iklan dan menambah ciri tambahan.
  - Saluran percuma udara seperti Thai PBS, Channel 3 dan Channel 7 disenaraikan antara saluran percuma TrueID; saluran premium TrueVisions memerlukan pakej berbayar.
  notes:
  - Channel 7HD telah menggabungkan aplikasi BUGABOO.TV dan CH7HD ke dalam aplikasi baharu bernama CH7ON.
tw:
  dtt: TV terestrial digital percuma menggunakan DVB-T dan telah menggantikan analog sepenuhnya sejak 30 Jun 2012; penonton memerlukan antena TV digital dan TV atau kotak penyahkod dengan penyahkodan HD, kerana beberapa saluran adalah dalam HD. Ia percuma dan membawa kira-kira 20 saluran daripada lima penyiar terestrial (TTV, CTV, CTS, FTV dan PTS).
  services:
  - Platform tanpa iklan penyiar awam mempunyai strim langsung percuma PTS, PTS Taigi, PTS XS dan PTS News, serta drama dan dokumentari atas permintaan yang kebanyakannya percuma; akaun diperlukan dan beberapa tajuk adalah bayar setiap tontonan.
  - Saluran YouTube rasmi PTS menstrim PTS News 24 jam sehari, dan PTS juga menyenaraikan strim langsung rasmi saluran utamanya dan PTS Taigi.
  - Berita, dokumentari dan saluran langsung berbahasa Inggeris percuma dari Taiwan, tanpa iklan dan tersedia di seluruh dunia.
  - Aplikasi berita percuma CTS termasuk strim berita langsung 24 jam.
  notes:
  - Isyarat terestrial juga disalurkan melalui satelit sebagai alternatif percuma bagi kawasan yang mempunyai penerimaan terestrial yang lemah.
  - Sesetengah saluran berita komersial telah menghentikan strim langsung YouTube 24 jam mereka di Taiwan, jadi ketersediaan di YouTube boleh berubah.
uk:
  dtt: Freeview bebas langganan dan memerlukan antena bumbung atau dalam rumah serta TV atau kotak Freeview; ia menawarkan sekitar 70 saluran TV, atau lebih 100 termasuk saluran HD dan saluran strim, bergantung pada kawasan anda. Saluran HD menggunakan DVB-T2, jadi penerima lama yang hanya menyokong DVB-T hanya mendapat saluran definisi standard. Freely menyampaikan saluran langsung utama melalui jalur lebar tanpa antena.
  services:
  - Saluran langsung BBC dan program BBC atas permintaan tanpa iklan; lesen TV diperlukan untuk menggunakannya.
  - Saluran langsung ITV percuma disokong iklan, saluran penstriman bertema dan rancangan atas permintaan; ITVX Premium membuang kebanyakan iklan atas permintaan dan menambah BritBox.
  - Channel 4, E4, More4, Film4 dan 4seven secara langsung dan percuma serta program atas permintaan dan arkib; pendaftaran percuma diperlukan.
  - Perkhidmatan penstriman Channel 5 (dahulunya My5) dengan saluran langsungnya, saluran penstriman percuma dan tonton semula.
  - Terbina dalam sesetengah TV pintar dan peranti, ia menstrim lebih 70 saluran langsung daripada BBC, ITV, Channel 4, Channel 5 dan lain-lain melalui jalur lebar (10Mbps disyorkan), tanpa antena.
  notes:
  - Lesen TV diperlukan untuk menonton atau merakam TV langsung di mana-mana saluran atau perkhidmatan (termasuk Freeview, Freely dan strim langsung dalam aplikasi) dan untuk menggunakan BBC iPlayer sama sekali; kandungan atas permintaan daripada perkhidmatan lain tidak memerlukannya.
  - Lesen TV berharga £180 setahun menurut GOV.UK; menonton TV langsung tanpanya boleh dikenakan denda sehingga £1,000.
  - BBC iPlayer dan strim langsung dalam aplikasi penyiar UK adalah untuk penonton UK; Watch Live Channel 4 terhad kepada penduduk UK.
us:
  dtt: Stesen penyiaran tempatan (seperti ABC, CBS, NBC, Fox, PBS dan subsaluran mereka) adalah percuma melalui udara dengan antena dan TV atau penukar dengan penala ATSC; bilangan saluran bergantung pada lokasi. ATSC 3.0 (NEXTGEN TV) memerlukan penala yang serasi, dan stesen mesti terus bersiaran dalam ATSC 1.0, jadi TV sedia ada masih berfungsi.
  services:
  - Strim langsung percuma stesen PBS tempatan anda serta program PBS atas permintaan.
  - Ratusan saluran langsung percuma disokong iklan serta filem dan rancangan atas permintaan; tiada akaun diperlukan.
  - Perpustakaan atas permintaan percuma yang besar serta lebih 250 saluran langsung, termasuk berita tempatan daripada stesen Fox dan kumpulan lain.
  - Saluran langsung, filem, rancangan dan Roku Originals percuma disokong iklan, boleh ditonton di web dan aplikasi mudah alih Roku serta peranti Roku.
  notes:
  - Strim langsung PBS hanya menunjukkan stesen untuk kawasan geografi anda, dan akaun diperlukan pada aplikasi peranti penstriman.
  - Sesetengah stesen menyulitkan isyarat ATSC 3.0 mereka, yang boleh menyekat penerimaan pada sesetengah peranti NEXTGEN TV; FCC sedang mengkaji perkara ini.
vn:
  dtt: TV terestrial digital disiarkan secara percuma dan boleh ditonton dengan antena dan TV dengan penala DVB-T2 terbina dalam atau kotak penyahkod DVB-T2; menurut VTV, pakej saluran VTV penuh dibawa melalui DVB-T2. TV terestrial analog dihentikan di seluruh negara pada 28 Disember 2020.
  services:
  - Platform nasional penyiar awam menstrim saluran VTV, saluran penting nasional dan saluran wilayah secara langsung dan percuma, dengan ulang tayang program lepas; peringkat berbayar VTVgo Plus membuang iklan timbul dan menambah ciri tambahan.
  - Akaun berdaftar percuma membuka beberapa saluran langsung asas, termasuk VTV1; saluran bertanda VIP memerlukan pelan berbayar.
  - Aplikasi percuma untuk saluran langsung yang dihasilkan oleh HTV dan pusat kabel HTVC, serta filem dan program atas permintaan.
  notes:
  - VTV1 ditetapkan sebagai saluran penting nasional dan disiarkan secara percuma.
  - Aplikasi HTV Online hanya melayani pengguna di dalam Vietnam.
  - Saluran VTC berhenti bersiaran pada Januari 2025 sebagai sebahagian daripada penstrukturan semula media negara.
