code: tw
country: Taiwan
dtt:
  standard: DVB-T
  platform: ""
  summary: Free digital terrestrial TV uses DVB-T and has fully replaced analogue since 30 June 2012; viewers need a digital TV antenna and a TV or set-top box with HD decoding, since several channels are in HD. It is free and carries about 20 channels from the five terrestrial broadcasters (TTV, CTV, CTS, FTV and PTS).
services:
  - name: 公視+ (PTS+)
    owner: Public Television Service (PTS)
    cost: freemium
    live_tv: true
    platforms: [web, iOS, Android]
    url: https://www.ptsplus.tv
    summary: The public broadcaster's ad-free platform has free live streams of PTS, PTS Taigi, PTS XS and PTS News, and mostly free on-demand dramas and documentaries; an account is required and a few titles are pay-per-view.
  - name: 公視新聞網 PNN (YouTube)
    owner: Public Television Service (PTS)
    cost: free
    live_tv: true
    platforms: [YouTube]
    url: https://www.youtube.com/@PNNPTS
    summary: PTS's official YouTube channel streams PTS News 24 hours a day, and PTS also lists official live streams of its main channel and PTS Taigi.
  - name: TaiwanPlus
    owner: Public Television Service (PTS), funded by the Ministry of Culture
    cost: free
    live_tv: true
    platforms: [web, iOS, Android, Apple TV, Android TV]
    url: https://www.taiwanplus.com
    summary: Free English-language news, documentaries and a live channel from Taiwan, ad-free and available worldwide.
  - name: 華視新聞 (CTS News)
    owner: Chinese Television System (CTS)
    cost: free
    live_tv: true
    platforms: [iOS]
    url: https://news.cts.com.tw
    summary: CTS's free news app includes a 24-hour live news stream.
notes:
  - Terrestrial signals are also relayed by satellite as a free alternative for areas with poor terrestrial reception.
  - Some commercial news channels have stopped their 24-hour YouTube live streams in Taiwan, so availability on YouTube can change.
