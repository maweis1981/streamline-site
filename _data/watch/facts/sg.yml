code: sg
country: Singapore
dtt:
  standard: DVB-T2
  platform: ""
  summary: Mediacorp's free-to-air channels have been broadcast digitally in DVB-T2 since analogue TV ended on 1 January 2019; viewers need a TV with a built-in DVB-T2 tuner or a DVB-T2 set-top box, plus an indoor or rooftop UHF antenna. Reception is free, and the six free-to-air channels are Channel 5, Channel 8, Channel U, Suria, Vasantham and CNA.
services:
  - name: mewatch
    owner: Mediacorp
    cost: freemium
    live_tv: true
    platforms: [web, iOS, Android, Apple TV]
    url: https://www.mewatch.sg
    summary: Free live streams of Channel 5, Channel 8, Channel U, Suria, Vasantham and CNA plus free on-demand Mediacorp programmes, with a paid Prime tier for ad-free viewing and partner content; live channels work only in Singapore.
  - name: CNA
    owner: Mediacorp
    cost: free
    live_tv: true
    platforms: [web, iOS, Android, YouTube]
    url: https://www.channelnewsasia.com
    summary: The free CNA app and CNA's official YouTube channel carry the CNA 24/7 livestream and on-demand documentaries and current affairs shows, and are available outside Singapore.
  - name: 8world
    owner: Mediacorp
    cost: free
    live_tv: false
    platforms: [iOS, Android]
    url: https://www.8world.com
    summary: Mediacorp's free Chinese-language news app, with current affairs programmes and news bulletins on demand.
notes:
  - Singapore abolished its radio and TV licence fee from 1 January 2011, so no fee is needed to watch.
  - Live channels on mewatch are geo-restricted to Singapore; only selected programmes can be watched overseas.
  - Pay-TV subscribers (StarHub, Singtel) already receive Mediacorp's free-to-air channels digitally.
