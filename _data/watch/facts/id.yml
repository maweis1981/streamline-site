code: id
country: Indonesia
dtt:
  standard: DVB-T2
  platform: ""
  summary: Free-to-air digital TV needs an antenna and a TV with a DVB-T2 tuner, or a DVB-T2 set-top box for an older analogue TV; watching is free. Analogue broadcasts were switched off region by region between 2022 and 2023, and the government distributed free set-top boxes to low-income households.
services:
  - name: TVRI Klik
    owner: Televisi Republik Indonesia (TVRI)
    cost: free
    live_tv: true
    platforms: [web, iOS, Android]
    url: https://tvri.go.id/live
    summary: Free live streams of the public broadcaster's national channels (including TVRI Nasional and TVRI Sport) and regional stations, plus on-demand replays.
  - name: RCTI+
    owner: MNC Group
    cost: free with ads
    live_tv: true
    platforms: [web, iOS, Android, Android TV]
    url: https://www.rctiplus.com/
    summary: Free ad-supported live streams of RCTI, MNCTV, GTV and iNews, with catch-up of recent programmes.
  - name: Vidio
    owner: Emtek (Elang Mahkota Teknologi)
    cost: freemium
    live_tv: true
    platforms: [web, Android, Android TV]
    url: https://www.vidio.com/
    summary: Free-to-air channels such as SCTV and Indosiar can be streamed live for free with ads; premium channels, many sports matches and ad-free viewing need a paid plan.
notes:
  - Many unofficial "TV online" apps are unlicensed; the broadcasters' own apps and websites are the legal options.
