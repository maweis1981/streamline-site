title: Doubo
url: "https://doubo.tv"
baseurl: ""   # Custom domain (see CNAME). Use "/streamline-site" to serve from maweis1981.github.io instead.
repository_url: "https://github.com/maweis1981/streamline-site"   # Public repo: issues here collect feedback.

# App Store Connect Apple ID. Enables the Safari smart app banner once the app is live.
app_store_id: "6821588266"

# Store links. Leave empty until the listing is live; the site then shows "Coming soon".
links:
  app_store: ""
  testflight: ""
  support_email: ""

# Analytics. Only rendered when JEKYLL_ENV=production, so local previews never send data.
# Repository variables GTM_ID and GA_MEASUREMENT_ID override these at deploy time.
# GA4 (G-3TGF00MYWL) is configured inside GTM (see analytics/gtm-container-doubo.json), so ga_measurement_id stays empty to avoid double counting.
analytics:
  gtm_id: "GTM-MJDCLXML" # Public container ID; the GTM_ID repository variable overrides it.
  ga_measurement_id: ""  # G-XXXXXXXXXX
  consent: eea           # "eea": opt-in in EEA/UK/CH, opt-out elsewhere; "strict": opt-in everywhere

languages: [zh, en, ms, id, vi, th]   # Order of the language menu; each needs _data/locales/<code>.yml and pages under /<code>/.
default_lang: zh

markdown: kramdown
permalink: pretty
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - README.md
  - analytics
